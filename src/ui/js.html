<!-- ui/js.html — JavaScript do cliente.

     Fala com o servidor só por `google.script.run`. Sem framework, sem
     dependência externa: o HtmlService serve isto de um sandbox e cada
     biblioteca a mais é mais uma coisa para um voluntário manter daqui a
     cinco anos. -->
<script>
(function () {
  'use strict';

  var $ = function (selecao) { return document.querySelector(selecao); };

  /**
   * Quem está usando o sistema.
   *
   * A sessão vem do link mágico, trocada pelo servidor no carregamento, e fica
   * aqui — nunca numa URL. URL vai parar em histórico, print e grupo de
   * WhatsApp.
   *
   * Esconder aba por perfil é conveniência, NÃO segurança: quem abrir o
   * console do navegador chama google.script.run direto. Quem protege é a
   * guarda no servidor; isto aqui só evita mostrar botão que vai dar erro.
   */
  var EU = { sessao: '', nome: '', perfil: '' };

  var entrada = ENTRADA_DO_SERVIDOR;
  if (entrada) {
    EU = { sessao: entrada.sessao, nome: entrada.nome, perfil: entrada.perfil };
    try { localStorage.setItem('sessao', EU.sessao); } catch (erro) {}
    // Tira o código da barra de endereços: ele já foi usado, e deixá-lo à
    // mostra convida a compartilhar um link que não funciona mais.
    try {
      history.replaceState(null, '', location.pathname);
    } catch (erro) {}
  } else {
    try { EU.sessao = localStorage.getItem('sessao') || ''; } catch (erro) {}
  }

  // Veio pelo QR da estante: abre direto na tela de pegar livro.
  if (TELA_INICIAL === 'pegar') irPara('pegar');

  function podeVer(acao) {
    var ordem = ['consulta', 'atendente', 'bibliotecario', 'admin'];
    var exige = {
      emprestar: 'atendente', ver_atrasos: 'atendente', definir_tema: 'atendente',
      cadastrar_obra: 'bibliotecario', editar_pessoa: 'bibliotecario'
    };
    return ordem.indexOf(EU.perfil) >= ordem.indexOf(exige[acao] || 'admin');
  }

  function mostrarIdentidade() {
    var entrou = !!EU.perfil;
    // Nome e perfil em elementos separados: em tela estreita o perfil sai e o
    // nome fica, porque saber COM QUEM se está gravando é o que importa.
    $('#meu-nome').textContent = entrou ? EU.nome : '';
    $('#meu-perfil').textContent = entrou ? ' · ' + EU.perfil : '';
    $('#btn-entrar').classList.toggle('oculta', entrou);
    $('#btn-sair').classList.toggle('oculta', !entrou);

    document.querySelectorAll('.aba[data-exige]').forEach(function (aba) {
      aba.classList.toggle('oculta', !podeVer(aba.dataset.exige));
    });

    // Mudar acesso é só da diretoria. Esconder aqui é conveniência — quem
    // recusa de verdade é `perfilPedido_`, no servidor.
    var soAdmin = !podeVer('mudar_perfil');
    $('#perfil-novo').classList.toggle('oculta', soAdmin);
    $('#perfil-edicao').classList.toggle('oculta', soAdmin);

    // A legenda só faz sentido para quem enxerga as duas cores.
    $('#legenda-abas').classList.toggle('oculta', !entrou);
  }

  /** Sessão guardada pode ter vencido enquanto a aba estava fechada. */
  function conferirSessao() {
    if (!EU.sessao) { mostrarIdentidade(); return; }

    google.script.run
      .withSuccessHandler(function (quem) {
        if (quem) { EU.nome = quem.nome; EU.perfil = quem.perfil; }
        else { esquecerSessao(); }
        mostrarIdentidade();
        carregarSugestoes();
      })
      .withFailureHandler(function () { esquecerSessao(); mostrarIdentidade(); })
      .verSessao(EU.sessao);
  }

  function esquecerSessao() {
    EU = { sessao: '', nome: '', perfil: '' };
    try { localStorage.removeItem('sessao'); } catch (erro) {}

    // Sair não recarrega a página — o botão troca de aba e pronto. Sem apagar
    // isto aqui, o convite com o link de agendamento ficava no DOM depois da
    // saída, e a agenda não seria remontada porque já constava carregada.
    agendaCarregada = false;
    var convite = $('#convite-agendamento');
    if (convite) convite.innerHTML = '';
  }

  $('#btn-entrar').addEventListener('click', function () {
    irPara('entrada');
  });

  $('#btn-sair').addEventListener('click', function () {
    var sessao = EU.sessao;
    esquecerSessao();
    mostrarIdentidade();
    irPara('busca');
    google.script.run.encerrarSessao(sessao);
  });

  $('#form-entrar').addEventListener('submit', function (evento) {
    evento.preventDefault();
    var botao = $('#btn-pedir-link');
    botao.disabled = true;
    dizer($('#estado-entrada'), 'Enviando…');

    google.script.run
      .withSuccessHandler(function (recado) {
        botao.disabled = false;
        dizer($('#estado-entrada'), recado, 'ok');
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer($('#estado-entrada'), erro.message || 'Não consegui enviar.', 'erro');
      })
      .pedirAcesso(this.elements.email.value);
  });

  /** Troca de visão por código, para os botões que não são aba. */
  function irPara(visao) {
    document.querySelectorAll('.aba').forEach(function (aba) {
      aba.classList.toggle('ativa', aba.dataset.visao === visao);
    });
    document.querySelectorAll('.visao').forEach(function (secao) {
      secao.classList.toggle('oculta', secao.id !== 'visao-' + visao);
    });
  }

  // Campos que a consulta ao Google governa. Ela sobrescreve todos, inclusive
  // com vazio: manter metade do livro anterior montaria uma ficha com dados de
  // duas obras diferentes.
  var CAMPOS_DA_CONSULTA = ['titulo', 'subtitulo', 'autor_ou_medium',
    'autor_espiritual', 'editora', 'ano', 'sinopse'];

  // ---------------------------------------------------------------- navegação
  document.querySelectorAll('.aba').forEach(function (aba) {
    aba.addEventListener('click', function () {
      document.querySelectorAll('.aba').forEach(function (outra) {
        outra.classList.toggle('ativa', outra === aba);
      });
      document.querySelectorAll('.visao').forEach(function (visao) {
        visao.classList.toggle('oculta', visao.id !== 'visao-' + aba.dataset.visao);
      });
    });
  });

  // ------------------------------------------------------------------- busca
  var termo = $('#termo');
  var estadoBusca = $('#estado-busca');
  var resultados = $('#resultados');
  var buscaEmVoo = 0;

  $('#form-busca').addEventListener('submit', function (evento) {
    evento.preventDefault();
    buscar(termo.value);
  });

  // Busca enquanto digita, com folga de 300ms. Sem isso, cada tecla vira uma
  // chamada ao servidor e a lista pisca.
  var temporizador = null;
  termo.addEventListener('input', function () {
    clearTimeout(temporizador);
    temporizador = setTimeout(function () { buscar(termo.value); }, 300);
  });

  function buscar(texto) {
    if (!texto.trim()) {
      resultados.innerHTML = '';
      dizer(estadoBusca, '');
      return;
    }

    // Resposta de busca antiga não pode sobrescrever resposta nova: quem
    // digita rápido dispara várias e elas voltam fora de ordem.
    var estaBusca = ++buscaEmVoo;
    dizer(estadoBusca, 'Procurando…');

    google.script.run
      .withSuccessHandler(function (achados) {
        if (estaBusca !== buscaEmVoo) return;
        mostrarResultados(achados, texto);
      })
      .withFailureHandler(function (erro) {
        if (estaBusca !== buscaEmVoo) return;
        resultados.innerHTML = '';
        dizer(estadoBusca, erro.message || 'Não consegui buscar agora.', 'erro');
      })
      .buscarNoAcervo(texto);
  }

  /**
   * Desenha o resultado em grupos, pelo que a pessoa pode fazer com o livro:
   * levar emprestado, ler na casa, ou nada — o catálogo conhece mas a casa
   * não tem.
   *
   * O catálogo tem centenas de obras pré-cadastradas sem exemplar (D5). Numa
   * lista só, buscar "emmanuel" enterrava os quatro livros que dá para levar
   * hoje debaixo de setenta que a casa não tem. A pergunta do balcão é "vocês
   * têm?", e a resposta tem que caber na primeira tela.
   *
   * "Só para ler na casa" é grupo próprio e aberto: é resposta ("tem, para ler
   * aqui"), e misturado aos outros faria quem quer levar abrir livro por livro
   * para descobrir que não sai. Cada obra aparece uma vez só, no melhor grupo:
   * se um exemplar sai, ela está em "Para levar", e o selo avisa do que fica.
   *
   * O grupo do que falta não some — ele é a lista de doações desejadas, e é o
   * motivo de o título sem exemplar existir. Só fica recolhido. Quando não há
   * nada na casa, abre sozinho: senão a tela ficaria vazia com a resposta
   * escondida atrás de um clique.
   */
  function mostrarResultados(achados, texto) {
    resultados.innerHTML = '';

    if (!achados.length) {
      dizer(estadoBusca, /^\s*\d+\s*$/.test(texto || '')
        ? 'Nenhum tombo nem obra com o número ' + texto.trim() + '.'
        : 'Nada encontrado. Tente outra palavra, ou parte dela.');
      return;
    }

    // O que casou pelo número (tombo ou nº da obra) vem à parte e primeiro:
    // quem digita um número sabe qual livro quer. O resto segue os grupos.
    var peloNumero = achados.filter(function (obra) { return obra.por_numero; });
    var porTexto = achados.filter(function (obra) { return !obra.por_numero; });

    var comEstado = function (estados) {
      return porTexto.filter(function (obra) { return estados.indexOf(obra.estado) !== -1; });
    };
    var paraLevar = comEstado(['disponivel', 'emprestado']);
    var soNaCasa = comEstado(['so_na_casa']);
    var faltando = comEstado(['sem_exemplar']);

    var resumo = porTexto.length
      ? resumoDaBusca(paraLevar.length, soNaCasa.length, faltando.length)
      : '';
    if (peloNumero.length) {
      resumo = plural(peloNumero.length, 'achado pelo número', 'achados pelo número') +
        (resumo ? ' · ' + resumo : '');
    }
    dizer(estadoBusca, resumo);

    // Título de grupo só quando há mais de um: com um grupo só, o selo de
    // cada obra já diz tudo.
    var variosGrupos = [peloNumero, paraLevar, soNaCasa, faltando]
      .filter(function (grupo) { return grupo.length; }).length > 1;

    desenharGrupo(peloNumero, 'Pelo número', 'divisor-numero', variosGrupos);
    desenharGrupo(paraLevar, 'Para levar emprestado', 'divisor-na-casa', variosGrupos);
    desenharGrupo(soNaCasa, 'Só para ler na casa', 'divisor-so-na-casa', variosGrupos);

    if (faltando.length) {
      resultados.appendChild(grupoRecolhido(faltando, !paraLevar.length && !soNaCasa.length));
    }
  }

  function desenharGrupo(obras, texto, classe, comTitulo) {
    if (!obras.length) return;
    if (comTitulo) resultados.appendChild(tituloDeGrupo(texto, obras.length, classe));
    obras.forEach(function (obra) { resultados.appendChild(itemDeObra(obra)); });
  }

  function resumoDaBusca(paraLevar, soNaCasa, faltando) {
    if (!soNaCasa && !faltando) return paraLevar === 1 ? '1 obra' : paraLevar + ' obras';
    if (!paraLevar && !soNaCasa) return 'nenhuma na casa · ' + faltando + ' no catálogo';

    var partes = [];
    if (paraLevar) partes.push(paraLevar + ' para levar');
    if (soNaCasa) partes.push(soNaCasa + ' só para ler na casa');
    if (faltando) partes.push(faltando + ' só no catálogo');
    return partes.join(' · ');
  }

  function tituloDeGrupo(texto, quantas, classe) {
    var item = document.createElement('li');
    item.className = 'divisor ' + classe;
    item.appendChild(elemento('h2', texto + ' (' + quantas + ')'));
    return item;
  }

  /** O grupo do que a casa não tem, dentro de um <details>. */
  function grupoRecolhido(obras, aberto) {
    var item = document.createElement('li');
    item.className = 'divisor divisor-ausente';

    var caixa = document.createElement('details');
    if (aberto) caixa.open = true;

    var resumo = document.createElement('summary');
    resumo.textContent = 'A casa não tem (' + obras.length + ')';
    caixa.appendChild(resumo);

    caixa.appendChild(elemento('p',
      'Estas obras estão no catálogo para consulta e para a lista de doações. ' +
      'Se quiser alguma, fale com quem estiver no balcão.', 'dica'));

    var lista = document.createElement('ul');
    lista.className = 'resultados';
    obras.forEach(function (obra) { lista.appendChild(itemDeObra(obra)); });
    caixa.appendChild(lista);

    item.appendChild(caixa);
    return item;
  }

  function itemDeObra(obra) {
    var item = document.createElement('li');
    item.className = 'resultado';

    // Achado pelo número: diz QUAL número casou. "Tombo 142" e "obra nº 142"
    // podem ser livros diferentes, e quem digitou "142" precisa saber qual é
    // qual.
    var numero = obra.por_numero;
    var exemplar = numero && numero.exemplar;
    if (numero) {
      // Obra unida a outra: o número antigo leva à que ficou, e diz isso.
      var unida = numero.tipo === 'obra' && Number(obra.id_titulo) !== Number(numero.numero);
      item.appendChild(elemento('p', numero.tipo === 'tombo'
        ? 'Tombo ' + numero.numero
        : 'Obra nº ' + numero.numero + (unida ? ' — unida à nº ' + obra.id_titulo : ''),
        'achado-por'));
    }

    item.appendChild(elemento('h2', nomeDaObra(obra)));

    if (obra.autoria) item.appendChild(elemento('p', obra.autoria, 'autoria'));

    var meta = [];
    if (obra.categoria) meta.push(obra.categoria);
    if (obra.serie) {
      meta.push(obra.serie + (obra.ordem_na_serie ? ' nº ' + obra.ordem_na_serie : ''));
    }
    // Editora e ano vêm dos exemplares e podem ser vários. Achado pelo tombo,
    // vale a edição daquele exemplar, que é o que está na mão.
    if (exemplar) {
      if (exemplar.edicao) meta.push(exemplar.edicao);
    } else if (obra.edicoes && obra.edicoes.length) {
      meta.push(obra.edicoes.join(' / '));
    }
    // O número da obra, para quem trabalha no acervo: é por ele que se acha a
    // ficha de novo. O frequentador não precisa dele.
    if (podeVer('emprestar')) meta.push('obra nº ' + obra.id_titulo);
    if (meta.length) item.appendChild(elemento('p', meta.join(' · '), 'meta'));

    item.appendChild(exemplar
      ? elemento('span', textoDoExemplar(exemplar, obra), 'selo ' + classeDoExemplar(exemplar))
      : elemento('span', textoDeDisponibilidade(obra), 'selo ' + obra.estado));

    return item;
  }

  /**
   * A situação do exemplar daquele tombo — não da obra inteira. Nunca com
   * quem ele está: o servidor sequer manda.
   *
   * Se este não está livre mas outro exemplar da mesma obra está, diz: quem
   * veio perguntar pelo livro quer saber se leva algum.
   */
  function textoDoExemplar(exemplar, obra) {
    var situacao = exemplar.situacao;
    var texto = situacao === 'emprestado'
      ? 'emprestado' + (exemplar.previsao ? ' — previsão ' + exemplar.previsao : '')
      : situacao === 'baixado' ? 'não está mais no acervo'
      : situacao;

    if (situacao !== 'disponível' && obra.disponiveis > 0) {
      texto += ' · há outro exemplar disponível';
    }
    return texto;
  }

  function classeDoExemplar(exemplar) {
    return exemplar.situacao === 'emprestado' ? 'emprestado'
      : exemplar.situacao === 'baixado' ? 'sem_exemplar'
      : exemplar.situacao === 'só para ler na casa' ? 'so_na_casa'
      : 'disponivel';
  }

  /**
   * Nunca mostra com quem o livro está — o servidor sequer manda esse dado.
   * Aqui é só a redação.
   */
  function textoDeDisponibilidade(obra) {
    if (obra.estado === 'sem_exemplar') return 'a casa não tem exemplar';
    if (obra.estado === 'so_na_casa') return 'só para ler na casa';

    // Os que ficam na casa não entram no "de N": "1 de 2" faria pensar que o
    // outro está emprestado, e a pessoa voltaria para buscar um livro que
    // nunca sai.
    var ficam = obra.so_na_casa || 0;
    var saem = obra.total - ficam;
    var texto;

    if (obra.estado === 'disponivel') {
      texto = saem > 1
        ? 'disponível (' + obra.disponiveis + ' de ' + saem + ')'
        : 'disponível';
    } else {
      texto = obra.previsao
        ? 'emprestado — previsão ' + obra.previsao
        : 'emprestado';
    }

    if (ficam) texto += ' · ' + ficam + ' só para ler na casa';
    return texto;
  }

  // ---------------------------------------------------------------- cadastro
  var formulario = $('#form-cadastro');
  var estadoCadastro = $('#estado-cadastro');
  var caixaExemplar = formulario.elements.criar_exemplar;
  var camposExemplar = $('#campos-exemplar');

  google.script.run
    .withSuccessHandler(function (listas) {
      preencherSelect($('#categoria'), listas.categorias, 'doutrinário');
      preencherSelect($('#estado-exemplar'), listas.estados, 'bom');
      preencherSelect($('#estado-exemplar-avulso'), listas.estados, 'bom');
      preencherSelect($('#estado-exemplar-alterar'), listas.estados, 'bom');
      // Em "Alterar obra" a primeira opção é "sem categoria": o pré-cadastro
      // entrou sem ela, e sem a opção o select mostraria a primeira da lista
      // como se fosse a gravada.
      preencherSelect($('#categoria-alterar'), [''].concat(listas.categorias), '');
      $('#categoria-alterar').options[0].textContent = '(sem categoria)';
      // A lista de perfis vem do servidor, da mesma constante que a escada
      // de permissões usa — escrita à mão no HTML, sairia de sincronia.
      preencherSelect($('#perfil-pessoa'), listas.perfis, 'consulta');
      preencherSelect($('#perfil-pessoa-edicao'), listas.perfis, 'consulta');
    })
    .withFailureHandler(function () {
      dizer(estadoCadastro, 'Não consegui carregar as listas de categoria.', 'erro');
    })
    .lerListasDeCadastro();

  caixaExemplar.addEventListener('change', function () {
    camposExemplar.classList.toggle('oculta', !caixaExemplar.checked);
  });

  /**
   * "Obra psicografada" decide o papel do campo de autoria.
   *
   * O banco tem uma coluna só para os dois: obra de autor e psicografia nunca
   * têm os dois preenchidos. Quem diz qual papel aquele nome exerce é o campo
   * `autor_espiritual` estar cheio ou vazio — então a caixa só muda o rótulo
   * e mostra ou esconde o campo do espírito.
   */
  var caixaPsicografada = $('#psicografada');

  /** Liga a caixa ao campo de autoria de um formulário — "Obra nova" e
   *  "Alterar obra" têm o mesmo par. Devolve a função que reajusta. */
  function ligarAutoria(form, caixa, campoEspiritual, rotulo) {
    function ajustar() {
      var psicografada = caixa.checked;
      campoEspiritual.classList.toggle('oculta', !psicografada);
      rotulo.childNodes[0].nodeValue = psicografada ? '\n          Médium\n          ' : '\n          Autor\n          ';
      form.elements.autor_ou_medium.placeholder = psicografada
        ? 'Francisco Cândido Xavier (Chico Xavier)'
        : 'Allan Kardec';
      // Desmarcar significa "não é psicografia": o espírito tem que sair
      // junto, senão fica um autor_espiritual órfão mudando o sentido da ficha.
      if (!psicografada) form.elements.autor_espiritual.value = '';
    }
    caixa.addEventListener('change', ajustar);
    ajustar();
    return ajustar;
  }

  var ajustarAutoria = ligarAutoria(formulario, caixaPsicografada,
    $('#campo-espiritual'), $('#rotulo-autoria'));

  // --- títulos parecidos, enquanto se digita ---------------------------------
  /**
   * Avisa cedo que o livro talvez já esteja no acervo — antes de alguém
   * preencher a ficha inteira à toa. Pergunta ao servidor meio segundo depois
   * da última tecla, no título e no subtítulo, porque é o par que identifica
   * a obra: o programa fundamental e o complementar do ESDE têm o mesmo
   * título e são livros diferentes.
   *
   * É aviso e nada mais. Falhar aqui não diz nada: sem aviso, o cadastro
   * funciona igual, e o servidor confere de novo ao salvar.
   */
  function vigiarParecidas(form, caixa, opcoes) {
    var temporizador = null;
    var emVoo = 0;

    function esconder() {
      emVoo++;
      caixa.innerHTML = '';
      caixa.classList.add('oculta');
    }

    function conferir() {
      var titulo = form.elements.titulo.value.trim();
      if (titulo.length < 3 || !EU.sessao) { esconder(); return; }

      var esta = ++emVoo;
      google.script.run
        .withSuccessHandler(function (obras) {
          if (esta !== emVoo) return;
          mostrarParecidas(caixa, obras, opcoes);
        })
        .withFailureHandler(function () {
          if (esta === emVoo) esconder();
        })
        .procurarTitulosParecidos(EU.sessao,
          { titulo: titulo, subtitulo: form.elements.subtitulo.value.trim() },
          opcoes.ignorarId ? opcoes.ignorarId() : null);
    }

    ['titulo', 'subtitulo'].forEach(function (campo) {
      form.elements[campo].addEventListener('input', function () {
        clearTimeout(temporizador);
        temporizador = setTimeout(conferir, 500);
      });
    });

    return { conferir: conferir, esconder: esconder };
  }

  function mostrarParecidas(caixa, obras, opcoes) {
    caixa.innerHTML = '';
    if (!obras.length) { caixa.classList.add('oculta'); return; }

    var iguais = obras.some(function (obra) { return obra.motivo === 'mesmo_titulo'; });
    caixa.appendChild(elemento('p', iguais ? opcoes.seIgual : opcoes.seParecido,
      'parecidas-titulo'));

    var lista = document.createElement('ul');
    lista.className = 'candidatos';
    obras.forEach(function (obra) {
      var item = document.createElement('li');
      item.className = 'parecida';
      item.appendChild(elemento('strong', nomeDaObra(obra)));
      item.appendChild(elemento('small', detalhesDaObra(obra)));
      if (opcoes.acao) {
        var botao = document.createElement('button');
        botao.type = 'button';
        botao.className = 'discreto';
        botao.textContent = opcoes.acao.rotulo;
        botao.addEventListener('click', function () { opcoes.acao.fazer(obra); });
        item.appendChild(botao);
      }
      lista.appendChild(item);
    });
    caixa.appendChild(lista);

    if (opcoes.rodape) caixa.appendChild(elemento('p', opcoes.rodape, 'dica'));
    caixa.classList.remove('oculta');
  }

  var parecidasObra = vigiarParecidas(formulario, $('#parecidas-obra'), {
    seIgual: 'Esta obra já está no acervo. Se for o mesmo livro, não cadastre de novo:',
    seParecido: 'Há no acervo obra com título parecido. Confira se não é o mesmo livro:',
    acao: { rotulo: 'É esta — cadastrar só o exemplar', fazer: levarParaNovoExemplar },
    rodape: 'Título e subtítulo diferentes são outro livro: nesse caso, siga com o cadastro.'
  });

  /**
   * "É esta": a obra já existe, então o caminho certo é Novo exemplar. Leva
   * junto o que já se digitou do exemplar — editora e ano costumam ter vindo
   * do Google —, para ninguém digitar duas vezes.
   */
  function levarParaNovoExemplar(obra) {
    ['editora', 'ano', 'edicao', 'doado_por', 'observacao_exemplar', 'estado_exemplar']
      .forEach(function (campo) {
        formExemplar.elements[campo].value = formulario.elements[campo].value;
      });
    formExemplar.elements.so_na_casa.checked = formulario.elements.so_na_casa.checked;

    limparFormulario();
    abrirBlocoDeCadastro('exemplar');
    escolherObra(obra);
  }

  // ISBN: atalho, não caminho principal. Não achar é normal e não é erro.
  $('#btn-isbn').addEventListener('click', function () {
    var campo = formulario.elements.isbn;
    var aviso = $('#aviso-isbn');
    var botao = this;

    if (!campo.value.trim()) {
      aviso.textContent = 'Digite o ISBN primeiro.';
      return;
    }

    botao.disabled = true;
    aviso.textContent = 'Consultando…';

    google.script.run
      .withSuccessHandler(function (livro) {
        botao.disabled = false;
        if (!livro) {
          // O ISBN vai no recado de propósito: sem ele, "não achei" repetido
          // é indistinguível de "a consulta nem saiu".
          // Aponta o outro caminho em vez de mandar desistir: edição antiga
          // sem ISBN indexado costuma ser achada pelo título.
          aviso.textContent = 'ISBN ' + campo.value.trim() + ': não achei. ' +
            'Escreva o título abaixo e use "Procurar no Google" — edição ' +
            'antiga costuma aparecer pelo título mesmo sem ISBN.';
          return;
        }
        // Sobrescreve, inclusive com vazio. Antes só preenchia campo vazio, e
        // o efeito era pior do que o problema que evitava: consultar um
        // segundo ISBN não mudava nada, porque os campos já estavam cheios do
        // primeiro. Parecia que a consulta devolvia sempre o mesmo livro.
        //
        // Limpar o que a nova resposta não traz é de propósito: manter o
        // subtítulo do livro anterior montaria uma ficha Frankenstein com
        // dados de duas obras, e ninguém perceberia.
        CAMPOS_DA_CONSULTA.forEach(function (campoNome) {
          formulario.elements[campoNome].value = livro[campoNome] || '';
        });

        aviso.textContent = 'Preenchido com o ISBN ' + livro.isbn + ': "' +
          livro.titulo + '". ' + recadoDeAutoria(livro);
        // O título mudou sem ninguém digitar: o aviso de repetida não viu.
        parecidasObra.conferir();
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        aviso.textContent = erro.message || 'Não consegui consultar agora.';
      })
      .buscarPorIsbn(EU.sessao, campo.value);
  });

  // Busca por título: saída para quando o ISBN não acha, o que é comum em
  // editora brasileira. Não preenche sozinho — mostra candidatos e a
  // bibliotecária escolhe, olhando editora e ano.
  $('#btn-titulo').addEventListener('click', function () {
    var aviso = $('#aviso-titulo');
    var lista = $('#candidatos');
    var botao = this;
    var titulo = formulario.elements.titulo.value.trim();

    lista.innerHTML = '';
    if (titulo.length < 3) {
      aviso.textContent = 'Escreva ao menos três letras do título.';
      return;
    }

    botao.disabled = true;
    aviso.textContent = 'Procurando…';

    google.script.run
      .withSuccessHandler(function (livros) {
        botao.disabled = false;
        if (!livros.length) {
          aviso.textContent = 'Nada encontrado com esse título. Preencha à mão.';
          return;
        }
        aviso.textContent = livros.length + ' resultado(s). Escolha a edição ' +
          'certa pela editora e pelo ano:';
        livros.forEach(function (livro) {
          lista.appendChild(itemCandidato(livro, aviso, lista));
        });
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        aviso.textContent = erro.message || 'Não consegui consultar agora.';
      })
      .buscarLivrosPorTitulo(EU.sessao, titulo, formulario.elements.autor_ou_medium.value);
  });

  function itemCandidato(livro, aviso, lista) {
    var item = document.createElement('li');
    var botao = document.createElement('button');
    botao.type = 'button';
    botao.className = 'candidato';

    botao.appendChild(elemento('strong',
      livro.titulo + (livro.subtitulo ? ' — ' + livro.subtitulo : '')));

    // A autoria aparece já resolvida: em psicografia `autor` vem vazio, e
    // mostrar só ele deixaria o candidato sem identificação nenhuma.
    var quem = livro.autor_espiritual
      ? livro.autor_espiritual + (livro.autor_ou_medium ? ' / méd. ' + livro.autor_ou_medium : '')
      : livro.autor_ou_medium;

    var detalhes = [quem, livro.editora, livro.ano, livro.isbn]
      .filter(function (parte) { return parte; })
      .join(' · ');
    botao.appendChild(elemento('small', detalhes || 'sem outros dados'));

    botao.addEventListener('click', function () {
      CAMPOS_DA_CONSULTA.concat(['isbn']).forEach(function (campo) {
        formulario.elements[campo].value = livro[campo] || '';
      });
      lista.innerHTML = '';
      aviso.textContent = recadoDeAutoria(livro);
      parecidasObra.conferir();
      formulario.elements.categoria.focus();   // é o que o Google não traz
    });

    item.appendChild(botao);
    return item;
  }

  // --- duplicata -------------------------------------------------------------
  var painelDuplicata = $('#painel-duplicata');
  var duplicataDetalhe = $('#duplicata-detalhe');

  function esconderDuplicata() {
    painelDuplicata.classList.add('oculta');
  }

  formulario.addEventListener('input', esconderDuplicata);

  formulario.addEventListener('submit', function (evento) {
    evento.preventDefault();
    esconderDuplicata();

    var botao = $('#btn-salvar');
    botao.disabled = true;
    dizer(estadoCadastro, 'Conferindo se já existe…');

    // Pergunta ANTES de salvar para poder oferecer a saída certa. O servidor
    // recusa de novo na hora de gravar, dentro da trava — este aviso é
    // conveniência, não a garantia.
    //
    // Só título e subtítulo IGUAIS param aqui. O parecido já foi avisado
    // enquanto se digitava, e parar de novo por ele seria cobrar um clique a
    // mais justamente de quem já decidiu que é outro livro.
    google.script.run
      .withSuccessHandler(function (parecidas) {
        var iguais = parecidas.filter(function (obra) { return obra.motivo === 'mesmo_titulo'; });
        if (!iguais.length) {
          salvar(false);
          return;
        }
        botao.disabled = false;
        dizer(estadoCadastro, '');
        mostrarDuplicata(iguais);
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoCadastro, erro.message || 'Não consegui conferir.', 'erro');
      })
      .procurarTitulosParecidos(EU.sessao, dadosDoFormulario().dados, null);
  });

  /**
   * Uma linha por obra igual, cada uma com o seu botão: pode haver mais de uma
   * com o mesmo título e subtítulo, e acrescentar à errada põe o exemplar na
   * ficha errada.
   *
   * Sem exemplar em mãos não há o que acrescentar. Aí a resposta é só "já
   * está no catálogo" — oferecer o botão criaria um exemplar que não existe.
   */
  function mostrarDuplicata(iguais) {
    var comExemplar = formulario.elements.criar_exemplar.checked;
    var lista = $('#duplicatas');
    lista.innerHTML = '';

    duplicataDetalhe.textContent = comExemplar
      ? 'Se for o mesmo livro, acrescente este exemplar a ela — é o caso da segunda cópia.'
      : 'Se for o mesmo livro, não precisa cadastrar: ele já está no catálogo.';

    iguais.forEach(function (obra) {
      var item = document.createElement('li');
      item.className = 'parecida';
      item.appendChild(elemento('strong', nomeDaObra(obra)));
      item.appendChild(elemento('small', detalhesDaObra(obra)));
      if (comExemplar) {
        var botao = document.createElement('button');
        botao.type = 'button';
        botao.textContent = 'Acrescentar este exemplar a esta obra';
        botao.addEventListener('click', function () { somarExemplar(obra); });
        item.appendChild(botao);
      }
      lista.appendChild(item);
    });

    painelDuplicata.classList.remove('oculta');
    painelDuplicata.scrollIntoView({ block: 'nearest' });
  }

  function somarExemplar(obra) {
    var pacote = dadosDoFormulario();
    esconderDuplicata();
    dizer(estadoCadastro, 'Acrescentando exemplar…');

    google.script.run
      .withSuccessHandler(function (tombo) {
        dizer(estadoCadastro,
          'Exemplar acrescentado à obra nº ' + obra.id_titulo + '. Etiquete o ' +
          'livro com o tombo ' + tombo + '.', 'ok');
        // Este caminho também gera tombo, e ficava fora da lista: o número
        // só aparecia na linha de status, que a gravação seguinte apaga.
        // O nome é o da obra que recebeu o exemplar, não o que foi digitado.
        anotarEtiqueta(tombo, nomeDaObra(obra), pacote.dados.so_na_casa === true);
        limparFormulario();
      })
      .withFailureHandler(function (erro) {
        dizer(estadoCadastro, erro.message || 'Não consegui acrescentar.', 'erro');
      })
      .acrescentarExemplar(EU.sessao, obra.id_titulo, pacote.dados);
  }

  $('#btn-forcar').addEventListener('click', function () {
    esconderDuplicata();
    salvar(true);
  });

  /** Lê o formulário inteiro, separando o que é dado do que é controle. */
  function dadosDoFormulario() {
    var dados = {};
    Array.prototype.forEach.call(formulario.elements, function (campo) {
      if (!campo.name) return;
      dados[campo.name] = campo.type === 'checkbox' ? campo.checked : campo.value.trim();
    });

    delete dados.quem_registrou;
    // O select existe no formulário mesmo escondido, e mandá-lo faria o
    // servidor recusar a gravação inteira de um bibliotecário — que tem
    // direito de cadastrar pessoa, só não de dar acesso.
    if (!podeVer('mudar_perfil')) delete dados.perfil;
    delete dados.psicografada;   // controle de tela, não coluna

    return { dados: dados };
  }

  function salvar(permitirDuplicata) {
    var pacote = dadosDoFormulario();
    var botao = $('#btn-salvar');
    var dados = pacote.dados;

    botao.disabled = true;
    dizer(estadoCadastro, 'Salvando…');

    google.script.run
      .withSuccessHandler(function (resposta) {
        botao.disabled = false;
        var recado = 'Obra nº ' + resposta.id_titulo + ' cadastrada.';
        if (resposta.tombo) {
          recado += ' Etiquete o livro com o tombo ' + resposta.tombo + '.';
          anotarEtiqueta(resposta.tombo, nomeDaObra(dados), dados.so_na_casa === true);
        }
        dizer(estadoCadastro, recado, 'ok');
        limparFormulario();
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoCadastro, erro.message || 'Não consegui salvar.', 'erro');
      })
      .cadastrarTituloComExemplar(EU.sessao, dados, permitirDuplicata);
  }

  /**
   * Limpa a obra mas preserva quem está cadastrando, a série, o doador e a
   * editora: cataloga-se uma pilha de livros seguidos, quase sempre da mesma
   * série, da mesma doação ou da mesma editora.
   */
  function limparFormulario() {
    $('#btn-salvar').disabled = false;

    var serie = formulario.elements.serie.value;
    var doador = formulario.elements.doado_por.value;
    var editora = formulario.elements.editora.value;

    formulario.reset();
    formulario.elements.serie.value = serie;
    formulario.elements.doado_por.value = doador;
    formulario.elements.editora.value = editora;

    ajustarAutoria();
    parecidasObra.esconder();
    $('#aviso-isbn').textContent = '';
    $('#aviso-titulo').textContent = '';
    $('#candidatos').innerHTML = '';
    formulario.elements.titulo.focus();
  }

  // ----------------------------------------------------------------- balcão
  // Empréstimo e devolução na mesma tela. Vai ser usada em pé, no celular,
  // com o livro numa mão: o caminho é digitar o tombo e confirmar.

  var campoTombo = $('#tombo');
  var estadoTombo = $('#estado-tombo');
  var ficha = $('#ficha');
  var pessoaEscolhida = null;
  var tomboEmVoo = 0;
  var temporizadorTombo = null;

  // Quem atende é a mesma pessoa durante um plantão inteiro. Guardar poupa
  // redigitar a cada livro — e é dado do voluntário, não do frequentador.
  campoTombo.addEventListener('input', function () {
    clearTimeout(temporizadorTombo);
    temporizadorTombo = setTimeout(carregarTombo, 350);
  });

  function carregarTombo() {
    var valor = campoTombo.value.trim();
    ficha.classList.add('oculta');
    limparEscolhaDePessoa();

    if (!valor) { dizer(estadoTombo, ''); return; }

    var esta = ++tomboEmVoo;
    dizer(estadoTombo, 'Procurando o tombo…');

    google.script.run
      .withSuccessHandler(function (dados) {
        if (esta !== tomboEmVoo) return;
        dizer(estadoTombo, '');
        mostrarFicha(dados);
      })
      .withFailureHandler(function (erro) {
        if (esta !== tomboEmVoo) return;
        dizer(estadoTombo, erro.message || 'Não consegui achar esse tombo.', 'erro');
      })
      .verExemplar(EU.sessao, valor);
  }

  function mostrarFicha(dados) {
    $('#ficha-titulo').textContent = dados.titulo;
    $('#ficha-autoria').textContent = dados.autoria;

    var meta = ['tombo ' + dados.tombo];
    if (dados.edicao) meta.push(dados.edicao);
    if (dados.estado) meta.push('estado: ' + dados.estado);
    $('#ficha-meta').textContent = meta.join(' · ');

    var observacao = $('#ficha-observacao');
    observacao.textContent = dados.observacao ? 'Observação: ' + dados.observacao : '';
    observacao.classList.toggle('oculta', !dados.observacao);

    var selo = $('#ficha-selo');
    var emprestado = dados.situacao === 'emprestado';
    var baixado = dados.situacao === 'baixado';
    var soNaCasa = dados.situacao === 'só para ler na casa';

    // Aqui PODE aparecer o nome de quem está com o livro: é tela de balcão,
    // não a busca pública. A distinção é a seção 6 da especificação.
    if (emprestado) {
      selo.textContent = 'com ' + dados.com_quem + ' — devolver até ' +
        dados.data_prevista +
        (dados.dias_de_atraso > 0
          ? ' (' + dados.dias_de_atraso + ' dia(s) de atraso)'
          : '');
    } else {
      selo.textContent = dados.situacao;
    }
    selo.className = 'selo ' + (emprestado ? 'emprestado'
      : baixado ? 'sem_exemplar'
      : soNaCasa ? 'so_na_casa'
      : 'disponivel');

    // Só "disponível" oferece emprestar — o que deixa de fora, sem regra a
    // mais, o livro só para ler na casa. O servidor recusa de novo.
    $('#acao-emprestar').classList.toggle('oculta', dados.situacao !== 'disponível');
    $('#acao-devolver').classList.toggle('oculta', !emprestado);
    ficha.classList.remove('oculta');
  }

  // --- escolher a pessoa
  var campoPessoa = $('#pessoa');
  var listaPessoas = $('#pessoas-achadas');
  var temporizadorPessoa = null;

  campoPessoa.addEventListener('input', function () {
    limparEscolhaDePessoa(true);
    clearTimeout(temporizadorPessoa);
    temporizadorPessoa = setTimeout(procurarPessoas, 300);
  });

  function procurarPessoas() {
    var termo = campoPessoa.value.trim();
    listaPessoas.innerHTML = '';
    if (termo.length < 2) return;

    google.script.run
      .withSuccessHandler(function (resposta) {
        var achadas = resposta.pessoas;
        listaPessoas.innerHTML = '';
        // Avisa quando a lista foi cortada. Numa casa com cinco "Maria", o
        // atendente precisa saber que não está vendo todas — senão empresta
        // para a Maria errada achando que era a única.
        if (resposta.sobraram) {
          $('#pessoa-escolhida').textContent =
            'Mostrando ' + achadas.length + '. Há mais ' + resposta.sobraram +
            ' com esse nome — escreva mais letras.';
        }
        if (!achadas.length) {
          $('#pessoa-escolhida').textContent =
            'Ninguém com esse nome. Cadastre em Cadastrar → Pessoa nova.';
          return;
        }
        achadas.forEach(function (pessoa) {
          var item = document.createElement('li');
          var botao = document.createElement('button');
          botao.type = 'button';
          botao.className = 'candidato';
          botao.textContent = pessoa.nome;
          botao.addEventListener('click', function () {
            pessoaEscolhida = pessoa;
            campoPessoa.value = pessoa.nome;
            listaPessoas.innerHTML = '';
            $('#pessoa-escolhida').textContent = 'Vai levar: ' + pessoa.nome;
            $('#btn-emprestar').disabled = false;
          });
          item.appendChild(botao);
          listaPessoas.appendChild(item);
        });
      })
      .withFailureHandler(function (erro) {
        $('#pessoa-escolhida').textContent = erro.message || 'Não consegui buscar.';
      })
      .buscarPessoas(EU.sessao, termo);
  }

  function limparEscolhaDePessoa(manterTexto) {
    pessoaEscolhida = null;
    $('#btn-emprestar').disabled = true;
    $('#pessoa-escolhida').textContent = '';
    listaPessoas.innerHTML = '';
    if (!manterTexto) campoPessoa.value = '';
  }

  // --- as três ações do balcão
  $('#btn-emprestar').addEventListener('click', function () {
    if (!pessoaEscolhida || !exigirAtendente()) return;
    acaoDeBalcao(this, 'Emprestando…', function (run) {
      return run.registrarEmprestimo(EU.sessao, campoTombo.value.trim(),
        pessoaEscolhida.id_pessoa, '');
    }, function (r) {
      return 'Emprestado a ' + r.nome + '. Devolver até ' + r.data_prevista + '.';
    });
  });

  $('#btn-devolver').addEventListener('click', function () {
    if (!exigirAtendente()) return;
    acaoDeBalcao(this, 'Registrando devolução…', function (run) {
      return run.registrarDevolucao(EU.sessao, campoTombo.value.trim());
    }, function (r) {
      return r.dias_de_atraso > 0
        ? 'Devolvido com ' + r.dias_de_atraso + ' dia(s) de atraso.'
        : 'Devolvido em dia.';
    });
  });

  $('#btn-renovar').addEventListener('click', function () {
    if (!exigirAtendente()) return;
    acaoDeBalcao(this, 'Renovando…', function (run) {
      return run.renovar(EU.sessao, campoTombo.value.trim());
    }, function (r) {
      return 'Renovado até ' + r.data_prevista + ' (renovação ' + r.renovacoes + ').';
    });
  });

  /** A identidade agora vem da sessão, não de quem digita o próprio nome. */
  function exigirAtendente() {
    if (EU.sessao) return true;
    dizer(estadoTombo, 'Entre no sistema para registrar movimentação.', 'erro');
    irPara('entrada');
    return false;
  }

  /**
   * As três ações têm a mesma coreografia: desabilita o botão, chama, mostra o
   * recado e limpa para o próximo livro. Repetir isso em três lugares é como
   * um botão acaba travado depois de uma falha.
   */
  function acaoDeBalcao(botao, aguardando, chamar, recado) {
    botao.disabled = true;
    dizer(estadoTombo, aguardando);

    chamar(google.script.run
      .withSuccessHandler(function (resposta) {
        botao.disabled = false;
        dizer(estadoTombo, recado(resposta), 'ok');
        ficha.classList.add('oculta');
        campoTombo.value = '';
        limparEscolhaDePessoa();
        campoTombo.focus();
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoTombo, erro.message || 'Não consegui completar.', 'erro');
      }));
  }

  // ---------------------------------------------------------------- atrasos
  var listaEmprestados = $('#lista-emprestados');
  var estadoAtrasos = $('#estado-atrasos');

  $('#btn-atrasados').addEventListener('click', function () { listar(true); });
  $('#btn-todos').addEventListener('click', function () { listar(false); });

  function listar(somenteAtrasados) {
    listaEmprestados.innerHTML = '';
    dizer(estadoAtrasos, 'Carregando…');

    google.script.run
      .withSuccessHandler(function (linhas) {
        if (!linhas.length) {
          dizer(estadoAtrasos, somenteAtrasados
            ? 'Nenhum livro atrasado.'
            : 'Nenhum livro emprestado no momento.');
          return;
        }
        dizer(estadoAtrasos, linhas.length + ' livro(s)');
        linhas.forEach(function (linha) {
          listaEmprestados.appendChild(itemEmprestado(linha));
        });
      })
      .withFailureHandler(function (erro) {
        dizer(estadoAtrasos, erro.message || 'Não consegui carregar.', 'erro');
      })
      .listarEmprestados(EU.sessao, somenteAtrasados);
  }

  function itemEmprestado(linha) {
    var item = document.createElement('li');
    item.className = 'resultado' + (linha.dias_de_atraso > 0 ? ' atrasado' : '');

    item.appendChild(elemento('h2', linha.titulo));
    if (linha.autoria) item.appendChild(elemento('p', linha.autoria, 'autoria'));
    item.appendChild(elemento('p',
      'tombo ' + linha.tombo + ' · com ' + linha.nome, 'meta'));

    var prazo = elemento('p', '', 'meta');
    if (linha.dias_de_atraso > 0) {
      prazo.appendChild(elemento('span',
        linha.dias_de_atraso + ' dia(s) de atraso', 'dias-atraso'));
      prazo.appendChild(document.createTextNode(' — venceu em ' + linha.data_prevista));
    } else {
      prazo.textContent = 'devolver até ' + linha.data_prevista;
    }
    if (Number(linha.renovacoes) > 0) {
      prazo.appendChild(document.createTextNode(
        ' · ' + linha.renovacoes + ' renovação(ões)'));
    }
    item.appendChild(prazo);

    return item;
  }

  // --------------------------------------------------- cadastro: abas internas
  // Só as que têm `data-bloco`: o "Cartaz da estante" tem a mesma cara, mas é
  // link para outra página — tratado como aba, ele esconderia todos os blocos.
  // Por função, e não só no clique: "É esta — cadastrar só o exemplar" troca
  // de bloco sem ninguém tocar na aba.
  function abrirBlocoDeCadastro(bloco) {
    document.querySelectorAll('.aba-interna[data-bloco]').forEach(function (aba) {
      aba.classList.toggle('ativa', aba.dataset.bloco === bloco);
    });
    $('#form-cadastro').classList.toggle('oculta', bloco !== 'obra');
    $('#form-exemplar').classList.toggle('oculta', bloco !== 'exemplar');
    $('#form-alterar-obra').classList.toggle('oculta', bloco !== 'alterar-obra');
    $('#form-alterar-exemplar').classList.toggle('oculta', bloco !== 'alterar-exemplar');
    $('#relatorio-acervo').classList.toggle('oculta', bloco !== 'relatorio');
    $('#bloco-repetidas').classList.toggle('oculta', bloco !== 'repetidas');
    // Monta de novo a cada abertura: relatório guardado da última vez
    // mostraria como disponível o livro que saiu há cinco minutos. A lista de
    // repetidas, pela mesma razão, mostraria o par que acabou de ser juntado.
    if (bloco === 'relatorio') carregarRelatorio();
    if (bloco === 'repetidas') carregarRepetidas();
    $('#form-pessoa').classList.toggle('oculta', bloco !== 'pessoa');
    $('#form-editar-pessoa').classList.toggle('oculta', bloco !== 'editar');
  }

  document.querySelectorAll('.aba-interna[data-bloco]').forEach(function (aba) {
    aba.addEventListener('click', function () { abrirBlocoDeCadastro(aba.dataset.bloco); });
  });

  // --------------------------------------------------------- cadastro: pessoa
  var formPessoa = $('#form-pessoa');
  var estadoPessoa = $('#estado-pessoa');

  formPessoa.addEventListener('submit', function (evento) {
    evento.preventDefault();
    var botao = $('#btn-salvar-pessoa');

    var dados = {};
    Array.prototype.forEach.call(formPessoa.elements, function (campo) {
      if (!campo.name) return;
      dados[campo.name] = campo.type === 'checkbox' ? campo.checked : campo.value.trim();
    });
    delete dados.quem_registrou;

    botao.disabled = true;
    dizer(estadoPessoa, 'Salvando…');

    google.script.run
      .withSuccessHandler(function (id) {
        botao.disabled = false;
        dizer(estadoPessoa, dados.nome + ' cadastrado (nº ' + id + ').', 'ok');
        formPessoa.reset();
        formPessoa.elements.nome.focus();
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoPessoa, erro.message || 'Não consegui salvar.', 'erro');
      })
      .criarPessoa(EU.sessao, dados);
  });


  // ------------------------------------------------------- etiquetas geradas
  //
  // O tombo é o único dado que precisa sair da tela e ir para o mundo físico:
  // alguém escreve o número numa etiqueta e cola no livro. Uma mensagem de
  // status não serve para isso — ela é apagada pela gravação seguinte, e quem
  // cataloga uma pilha salva tudo antes de pegar a caneta.
  var caixaEtiquetas = $('#etiquetas');
  var listaEtiquetas = $('#lista-etiquetas');

  function anotarEtiqueta(tombo, titulo, soNaCasa) {
    if (!tombo) return;

    var item = document.createElement('li');

    var numero = elemento('span', String(tombo), 'etiqueta-tombo');
    item.appendChild(numero);
    item.appendChild(elemento('span', titulo || '', 'etiqueta-obra'));
    // Vai escrito na etiqueta: o livro avisa sozinho que não sai, antes de
    // alguém digitar o tombo.
    if (soNaCasa) item.appendChild(elemento('span', 'só para ler na casa', 'etiqueta-marca'));

    // O mais novo em cima: é o livro que ainda está na mão.
    listaEtiquetas.insertBefore(item, listaEtiquetas.firstChild);
    caixaEtiquetas.classList.remove('oculta');
  }

  $('#limpar-etiquetas').addEventListener('click', function () {
    listaEtiquetas.innerHTML = '';
    caixaEtiquetas.classList.add('oculta');
  });

  // -------------------------------------------------- cadastro: alterar pessoa
  var formEditar = $('#form-editar-pessoa');
  var estadoEditar = $('#estado-editar');
  var camposEditar = $('#campos-editar');
  var buscaEditar = $('#busca-editar');
  var listaEditar = $('#pessoas-editar');
  var pessoaEmEdicao = null;
  var temporizadorEditar = null;

  buscaEditar.addEventListener('input', function () {
    clearTimeout(temporizadorEditar);
    temporizadorEditar = setTimeout(procurarParaEditar, 300);
  });

  function procurarParaEditar() {
    var termo = buscaEditar.value.trim();
    listaEditar.innerHTML = '';
    if (termo.length < 2) return;

    google.script.run
      .withSuccessHandler(function (achadas) {
        listaEditar.innerHTML = '';
        if (!achadas.length) {
          dizer(estadoEditar, 'Ninguém com esse nome.');
          return;
        }
        dizer(estadoEditar, '');
        achadas.forEach(function (pessoa) {
          var item = document.createElement('li');
          var botao = document.createElement('button');
          botao.type = 'button';
          botao.className = 'candidato';
          // Inativo aparece marcado: é justamente quem alguém vem reativar.
          botao.textContent = pessoa.nome + (pessoa.ativo ? '' : '  (inativo)');
          botao.addEventListener('click', function () { carregarPessoa(pessoa.id_pessoa); });
          item.appendChild(botao);
          listaEditar.appendChild(item);
        });
      })
      .withFailureHandler(function (erro) {
        dizer(estadoEditar, erro.message || 'Não consegui buscar.', 'erro');
      })
      .buscarPessoasParaEditar(EU.sessao, termo);
  }

  function carregarPessoa(idPessoa) {
    dizer(estadoEditar, 'Carregando…');

    google.script.run
      .withSuccessHandler(function (pessoa) {
        pessoaEmEdicao = pessoa;
        listaEditar.innerHTML = '';
        buscaEditar.value = '';
        dizer(estadoEditar, '');

        $('#editando-quem').textContent =
          'Alterando: ' + pessoa.nome + ' (nº ' + pessoa.id_pessoa + ')';

        formEditar.elements.nome.value = pessoa.nome;
        formEditar.elements.telefone.value = '';
        formEditar.elements.email.value = '';
        formEditar.elements.limpar_telefone.checked = false;
        formEditar.elements.limpar_email.checked = false;
        formEditar.elements.frequentador.checked = pessoa.frequentador;
        formEditar.elements.palestrante.checked = pessoa.palestrante;
        formEditar.elements.ativo.checked = pessoa.ativo;
        formEditar.elements.observacao.value = pessoa.observacao || '';
        $('#perfil-pessoa-edicao').value = pessoa.perfil || 'consulta';

        // Só diz SE existe, nunca o valor.
        $('#tem-telefone').textContent = pessoa.tem_telefone
          ? '(há um gravado)' : '(vazio)';
        $('#tem-email').textContent = pessoa.tem_email
          ? '(há um gravado)' : '(vazio)';

        camposEditar.classList.remove('oculta');
        formEditar.elements.nome.focus();
      })
      .withFailureHandler(function (erro) {
        dizer(estadoEditar, erro.message || 'Não consegui carregar.', 'erro');
      })
      .verPessoa(EU.sessao, idPessoa);
  }

  formEditar.addEventListener('submit', function (evento) {
    evento.preventDefault();
    if (!pessoaEmEdicao) return;

    var botao = $('#btn-salvar-edicao');
    var mudancas = {
      nome: formEditar.elements.nome.value.trim(),
      telefone: formEditar.elements.telefone.value.trim(),
      email: formEditar.elements.email.value.trim(),
      limpar_telefone: formEditar.elements.limpar_telefone.checked,
      limpar_email: formEditar.elements.limpar_email.checked,
      frequentador: formEditar.elements.frequentador.checked,
      palestrante: formEditar.elements.palestrante.checked,
      ativo: formEditar.elements.ativo.checked,
      observacao: formEditar.elements.observacao.value.trim()
    };

    // Campo ausente é 'não mexer' no servidor. Só o admin manda.
    if (podeVer('mudar_perfil')) {
      mudancas.perfil = $('#perfil-pessoa-edicao').value;
    }

    botao.disabled = true;
    dizer(estadoEditar, 'Salvando…');

    google.script.run
      .withSuccessHandler(function () {
        botao.disabled = false;
        dizer(estadoEditar, mudancas.nome + ' atualizado.', 'ok');
        camposEditar.classList.add('oculta');
        pessoaEmEdicao = null;
        buscaEditar.focus();
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoEditar, erro.message || 'Não consegui salvar.', 'erro');
      })
      .atualizarPessoa(EU.sessao, pessoaEmEdicao.id_pessoa, mudancas);
  });

  // ---------------------------------------------------------------- estante
  // Pegar livro sozinho, pelo QR. A mesma coreografia do balcão — digita o
  // tombo, a ficha aparece — mas sem login: a pessoa se identifica pelo e-mail
  // ou telefone, e o servidor nunca devolve o nome dela.

  var tomboPegar = $('#tombo-pegar');
  var estadoTomboPegar = $('#estado-tombo-pegar');
  var livroPegar = $('#livro-pegar');
  var formPegar = $('#form-pegar');
  var estadoPegar = $('#estado-pegar');
  var prontoPegar = $('#pronto-pegar');
  var pegarEmVoo = 0;
  var temporizadorPegar = null;

  tomboPegar.addEventListener('input', function () {
    livroPegar.classList.add('oculta');
    prontoPegar.classList.add('oculta');
    dizer(estadoPegar, '');
    clearTimeout(temporizadorPegar);
    temporizadorPegar = setTimeout(carregarLivroParaPegar, 350);
  });

  function carregarLivroParaPegar() {
    var valor = tomboPegar.value.trim();
    if (!valor) { dizer(estadoTomboPegar, ''); return; }

    var este = ++pegarEmVoo;
    dizer(estadoTomboPegar, 'Procurando o livro…');

    google.script.run
      .withSuccessHandler(function (livro) {
        if (este !== pegarEmVoo) return;
        dizer(estadoTomboPegar, '');
        mostrarLivroParaPegar(livro);
      })
      .withFailureHandler(function (erro) {
        if (este !== pegarEmVoo) return;
        dizer(estadoTomboPegar, erro.message || 'Não consegui procurar o livro.', 'erro');
      })
      .verLivroParaPegar(valor);
  }

  function mostrarLivroParaPegar(livro) {
    // Sem tombo na resposta: o número não existe.
    if (!livro.tombo) {
      dizer(estadoTomboPegar, livro.aviso, 'erro');
      return;
    }

    $('#livro-pegar-titulo').textContent = livro.titulo;
    $('#livro-pegar-autoria').textContent = livro.autoria;
    $('#livro-pegar-meta').textContent = ['tombo ' + livro.tombo, livro.edicao]
      .filter(function (parte) { return parte; })
      .join(' · ');

    var aviso = $('#livro-pegar-aviso');
    aviso.textContent = livro.aviso;
    aviso.classList.toggle('oculta', !livro.aviso);

    formPegar.classList.toggle('oculta', !livro.pode_pegar);
    livroPegar.classList.remove('oculta');
  }

  formPegar.addEventListener('submit', function (evento) {
    evento.preventDefault();
    var botao = $('#btn-pegar');
    var campoContato = $('#contato-pegar');
    var contato = campoContato.value.trim();

    if (!contato) {
      dizer(estadoPegar, 'Escreva o e-mail ou o telefone do seu cadastro.', 'erro');
      campoContato.focus();
      return;
    }

    botao.disabled = true;
    dizer(estadoPegar, 'Registrando…');

    google.script.run
      .withSuccessHandler(function (resposta) {
        botao.disabled = false;
        dizer(estadoPegar, '');
        livroPegar.classList.add('oculta');

        // O título e a data, e nada da pessoa: quem confirma que é ela é o
        // e-mail que acabou de sair.
        $('#pronto-pegar-texto').textContent = 'Pronto! "' + resposta.titulo +
          '" é seu até ' + resposta.data_prevista + '.';
        $('#pronto-pegar-email').textContent = resposta.avisado_por_email
          ? 'Mandamos a confirmação para o e-mail do cadastro. Boa leitura.'
          : 'Anote a data: a devolução é no balcão. Boa leitura.';
        prontoPegar.classList.remove('oculta');

        tomboPegar.value = '';
        campoContato.value = '';
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoPegar, erro.message || 'Não consegui registrar.', 'erro');
      })
      .pegarLivro(tomboPegar.value.trim(), contato);
  });

  // ----------------------------------------------------------------- agenda
  var listaReunioes = $('#lista-reunioes');
  var estadoAgenda = $('#estado-agenda');
  var agendaCarregada = false;

  // Só carrega quando a aba é aberta: a maioria de quem entra vem buscar
  // livro, e uma chamada ao servidor a cada visita custa quota à toa.
  document.querySelectorAll('.aba').forEach(function (aba) {
    aba.addEventListener('click', function () {
      if (aba.dataset.visao === 'agenda' && !agendaCarregada) carregarAgenda();
    });
  });

  /**
   * Monta o convite "Vai palestrar?" — se esta pessoa tiver o que fazer com
   * ele. O servidor decide e devolve vazio para todo o resto; aqui não há
   * regra de permissão nenhuma, só a redação.
   *
   * Sem sessão nem pergunta: visitante anônimo nunca vê o link, e essa é a
   * razão de ele não vir mais no template da página.
   */
  function montarConviteDeAgendamento() {
    var caixa = $('#convite-agendamento');
    caixa.innerHTML = '';
    if (!EU.sessao) return;

    google.script.run
      .withSuccessHandler(function (url) {
        if (!url) return;

        var bloco = document.createElement('div');
        bloco.className = 'convite';
        bloco.appendChild(elemento('p', 'Vai palestrar?', 'convite-titulo'));
        bloco.appendChild(elemento('p',
          'As datas livres estão na página de agendamento da casa. Escolha a ' +
          'sua por lá; ela aparece aqui no dia seguinte, e então você escreve ' +
          'o tema.'));

        var link = document.createElement('a');
        link.className = 'botao-link';
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = 'Escolher uma data';
        bloco.appendChild(link);

        caixa.appendChild(bloco);
      })
      // Falhar aqui não atrapalha a agenda: sem convite, ela funciona igual.
      .withFailureHandler(function () {})
      .verLinkDeAgendamento(EU.sessao);
  }

  function carregarAgenda() {
    agendaCarregada = true;
    listaReunioes.innerHTML = '';
    dizer(estadoAgenda, 'Carregando…');
    montarConviteDeAgendamento();

    google.script.run
      .withSuccessHandler(function (reunioes) {
        if (!reunioes.length) {
          dizer(estadoAgenda,
            'Nenhuma reunião marcada. Se a página de agendamento já existe, ' +
            'a sincronização roda de madrugada.');
          return;
        }
        dizer(estadoAgenda, reunioes.length + ' reunião(ões) marcada(s)');
        reunioes.forEach(function (reuniao) {
          listaReunioes.appendChild(itemReuniao(reuniao));
        });
      })
      .withFailureHandler(function (erro) {
        agendaCarregada = false;   // deixa tentar de novo
        dizer(estadoAgenda, erro.message || 'Não consegui carregar.', 'erro');
      })
      .listarProximasReunioes(12, EU.sessao);
  }

  function itemReuniao(reuniao) {
    var item = document.createElement('li');
    item.className = 'resultado' + (reuniao.minha ? ' minha' : '');

    item.appendChild(elemento('h2',
      reuniao.data + (reuniao.horario ? ' às ' + reuniao.horario : '')));

    item.appendChild(elemento('p',
      (reuniao.minha ? 'Você' : reuniao.palestrante) || 'sem palestrante inscrito',
      'autoria'));

    if (reuniao.tema) {
      item.appendChild(elemento('p', reuniao.tema, 'meta'));
    }

    // Campo de tema aparece só onde falta: reunião com tema definido vira
    // leitura, e a tela não fica um formulário gigante.
    // Quem escreve o tema: o atendente para cima, em QUALQUER reunião — é ele
    // quem preenche pelo palestrante que não consegue entrar no sistema. E o
    // palestrante, só na dele.
    var possoPorPermissao = podeVer('definir_tema');
    if (!reuniao.tema && (possoPorPermissao || reuniao.minha)) {
      var linha = document.createElement('div');
      linha.className = 'linha-isbn';

      var campo = document.createElement('input');
      campo.placeholder = 'tema desta reunião';
      campo.className = 'cresce';

      var botao = document.createElement('button');
      botao.type = 'button';
      botao.textContent = 'Gravar tema';
      botao.addEventListener('click', function () {
        var texto = campo.value.trim();
        if (!texto) { campo.focus(); return; }

        if (!EU.sessao) {
          dizer(estadoAgenda, 'Entre no sistema para gravar o tema.', 'erro');
          irPara('entrada');
          return;
        }

        botao.disabled = true;
        google.script.run
          .withSuccessHandler(function () {
            dizer(estadoAgenda, 'Tema gravado.', 'ok');
            agendaCarregada = false;
            carregarAgenda();
          })
          .withFailureHandler(function (erro) {
            botao.disabled = false;
            dizer(estadoAgenda, erro.message || 'Não consegui gravar.', 'erro');
          })
          // Duas portas, e a de permissão vem primeiro. Quem é atendente para
          // cima grava o tema de qualquer reunião — inclusive da própria, se
          // também for palestrante. Quem só é palestrante entra pela porta de
          // propriedade, e o servidor confere se a reunião é dele.
          [possoPorPermissao ? 'definirTema' : 'definirMeuTema'](
            EU.sessao, reuniao.id_reuniao, texto);
      });

      linha.appendChild(campo);
      linha.appendChild(botao);
      item.appendChild(linha);
    }

    return item;
  }

  // ------------------------------------------------------------ meus livros
  // Sem sessão, por decisão: parte dos frequentadores não tem e-mail. O
  // servidor devolve só livro e prazo, e responde igual para contato que não
  // existe — a tela não pode virar forma de descobrir quem frequenta a casa.

  var listaMeus = $('#lista-meus');
  var estadoMeus = $('#estado-meus');

  $('#form-meus').addEventListener('submit', function (evento) {
    evento.preventDefault();
    var contato = $('#contato').value.trim();

    listaMeus.innerHTML = '';
    if (!contato) { dizer(estadoMeus, ''); return; }
    dizer(estadoMeus, 'Procurando…');

    google.script.run
      .withSuccessHandler(function (resposta) {
        listaMeus.innerHTML = '';
        if (!resposta.emprestimos.length) {
          dizer(estadoMeus, resposta.recado);
          return;
        }
        dizer(estadoMeus, resposta.emprestimos.length === 1
          ? '1 livro com você'
          : resposta.emprestimos.length + ' livros com você');

        resposta.emprestimos.forEach(function (livro) {
          var item = document.createElement('li');
          item.className = 'resultado' + (livro.dias_de_atraso > 0 ? ' atrasado' : '');

          item.appendChild(elemento('h2', livro.titulo));
          if (livro.autoria) item.appendChild(elemento('p', livro.autoria, 'autoria'));

          var prazo = elemento('p', '', 'meta');
          if (livro.dias_de_atraso > 0) {
            prazo.appendChild(elemento('span',
              livro.dias_de_atraso + ' dia(s) de atraso', 'dias-atraso'));
            prazo.appendChild(document.createTextNode(
              ' — devolver em ' + livro.data_prevista));
          } else {
            prazo.textContent = 'devolver até ' + livro.data_prevista;
          }
          item.appendChild(prazo);

          listaMeus.appendChild(item);
        });
      })
      .withFailureHandler(function (erro) {
        dizer(estadoMeus, erro.message || 'Não consegui consultar.', 'erro');
      })
      .meusEmprestimos(contato);
  });


  // ------------------------------------------------------------ manual
  // Um assunto por vez. Quem consulta o manual está com um problema na mão, em
  // pé no balcão, e quer a resposta daquele problema — não a lista dos treze.
  //
  // O índice e o botão de voltar são governados por JS. Sem ele, tudo fica
  // visível e o manual volta a ser a página longa com âncoras: menos
  // confortável, mas inteiramente legível. Nada aqui é indispensável para ler.

  var indiceManual = $('.manual-indice');
  var voltarManual = $('#voltar-manual');
  // Abertura e rodapé pertencem ao índice: somem quando um assunto abre.
  var soNoIndice = document.querySelectorAll('.so-no-indice');
  var verbetes = Array.prototype.slice.call(document.querySelectorAll('.verbete'));

  function mostrarIndiceDoManual() {
    verbetes.forEach(function (verbete) { verbete.classList.add('oculta'); });
    document.querySelectorAll('.grupo[open]').forEach(function (grupo) {
      grupo.open = false;
    });
    indiceManual.classList.remove('oculta');
    soNoIndice.forEach(function (parte) { parte.classList.remove('oculta'); });
    voltarManual.classList.add('oculta');
  }

  function abrirVerbete(id) {
    verbetes.forEach(function (verbete) {
      verbete.classList.toggle('oculta', verbete.id !== id);
    });
    indiceManual.classList.add('oculta');
    soNoIndice.forEach(function (parte) { parte.classList.add('oculta'); });
    voltarManual.classList.remove('oculta');

    // Leva o foco ao título — quem usa teclado ou leitor de tela precisa saber
    // que a tela TROCOU, e não só que algo sumiu.
    //
    // O "preventScroll" não é detalhe: sem ele, focar rola a página até o
    // elemento e desfaz o scrollTo abaixo. O assunto abria com o cabeçalho já
    // fora da tela, parecendo ter aparecido no fim.
    var titulo = document.querySelector('#' + id + ' h2');
    if (titulo) titulo.focus({ preventScroll: true });

    // Só então sobe: o assunto começa onde os olhos já estão, e não onde a
    // rolagem do índice tinha parado.
    window.scrollTo(0, 0);
  }

  // Links do índice E referências cruzadas de dentro dos assuntos.
  //
  // Só o índice era ligado, e enquanto nenhum assunto citava outro isso
  // bastava. Não basta mais: um link para "#m-maisum" escrito dentro de um
  // verbete cai no salto de âncora do navegador, que rola até um elemento com
  // `oculta` — ou seja, o clique não faz absolutamente nada, sem erro nenhum
  // na tela. Ligar por assunto, e não por lugar na página, elimina a classe.
  var manual = indiceManual.parentNode;
  manual.querySelectorAll('a[href^="#m-"]').forEach(function (link) {
    link.addEventListener('click', function (evento) {
      evento.preventDefault();
      abrirVerbete(link.getAttribute('href').slice(1));
    });
  });

  voltarManual.addEventListener('click', mostrarIndiceDoManual);

  // Um grupo aberto por vez. Sem isto, abrir os cinco devolve a lista longa que
  // fechá-los veio resolver. `<details>` já abre e fecha sozinho — o JS só
  // acrescenta a exclusividade, e sem ele o índice continua utilizável.
  var grupos = Array.prototype.slice.call(document.querySelectorAll('.grupo'));
  grupos.forEach(function (grupo) {
    grupo.addEventListener('toggle', function () {
      if (!grupo.open) return;
      grupos.forEach(function (outro) {
        if (outro !== grupo) outro.open = false;
      });
    });
  });

  // Sair da aba Manual e voltar depois reabre no índice, não no assunto que
  // alguém leu semana passada.
  document.querySelectorAll('.aba').forEach(function (aba) {
    aba.addEventListener('click', function () {
      if (aba.dataset.visao === 'manual') mostrarIndiceDoManual();
    });
  });

  mostrarIndiceDoManual();


  // --------------------------------------------------- cadastro: novo exemplar
  // O caminho direto para a segunda cópia de um livro que a casa já tem. O
  // outro caminho — cadastrar a obra e ser avisado de que já existe — continua,
  // como rede para quem não sabe que o livro está lá.

  var formExemplar = $('#form-exemplar');
  var buscaObra = $('#busca-obra');
  var obrasAchadas = $('#obras-achadas');
  var camposExemplarNovo = $('#campos-exemplar-novo');
  var estadoExemplar = $('#estado-exemplar-novo');
  var estadoBuscaObra = $('#estado-busca-obra');
  var obraEscolhida = null;
  var temporizadorObra = null;

  buscaObra.addEventListener('input', function () {
    esquecerObra();
    clearTimeout(temporizadorObra);
    temporizadorObra = setTimeout(procurarObra, 300);
  });

  function esquecerObra() {
    obraEscolhida = null;
    camposExemplarNovo.classList.add('oculta');
  }

  function procurarObra() {
    var termo = buscaObra.value.trim();
    obrasAchadas.innerHTML = '';
    if (!termo) { dizer(estadoBuscaObra, ''); return; }

    dizer(estadoBuscaObra, 'Procurando…');

    google.script.run
      .withSuccessHandler(function (achados) {
        obrasAchadas.innerHTML = '';
        if (!achados.length) {
          dizer(estadoBuscaObra,
            'Nada encontrado. Se a obra ainda não existe, cadastre em ' +
            '"Obra nova".');
          return;
        }
        dizer(estadoBuscaObra, '');
        achados.forEach(function (obra) {
          obrasAchadas.appendChild(itemObra(obra, escolherObra));
        });
      })
      .withFailureHandler(function (erro) {
        dizer(estadoBuscaObra, erro.message || 'Não consegui buscar.', 'erro');
      })
      .buscarNoAcervo(termo);
  }

  /** Uma obra na lista de escolha — de "Novo exemplar" e de "Alterar obra". */
  function itemObra(obra, aoEscolher) {
    var item = document.createElement('li');
    var botao = document.createElement('button');
    botao.type = 'button';
    botao.className = 'candidato';

    // O nome inteiro, com o subtítulo: é ele que separa o programa
    // fundamental do complementar, que têm o mesmo título.
    botao.appendChild(elemento('strong', nomeDaObra(obra)));
    botao.appendChild(elemento('small', detalhesDaObra(obra)));

    botao.addEventListener('click', function () { aoEscolher(obra); });
    item.appendChild(botao);
    return item;
  }

  function escolherObra(obra) {
    obraEscolhida = obra;
    obrasAchadas.innerHTML = '';
    buscaObra.value = nomeDaObra(obra);
    dizer(estadoBuscaObra, '');

    desenharEscolhida($('#obra-escolhida'), 'Exemplar de', obra);

    camposExemplarNovo.classList.remove('oculta');
    formExemplar.elements.editora.focus();
  }

  formExemplar.addEventListener('submit', function (evento) {
    evento.preventDefault();
    if (!obraEscolhida) return;

    var botao = $('#btn-salvar-exemplar');
    var dados = {
      editora: formExemplar.elements.editora.value.trim(),
      ano: formExemplar.elements.ano.value.trim(),
      edicao: formExemplar.elements.edicao.value.trim(),
      estado_exemplar: formExemplar.elements.estado_exemplar.value,
      doado_por: formExemplar.elements.doado_por.value.trim(),
      so_na_casa: formExemplar.elements.so_na_casa.checked,
      observacao_exemplar: formExemplar.elements.observacao_exemplar.value.trim()
    };

    botao.disabled = true;
    dizer(estadoExemplar, 'Salvando…');

    google.script.run
      .withSuccessHandler(function (tombo) {
        botao.disabled = false;
        dizer(estadoExemplar,
          'Exemplar criado. Etiquete o livro com o tombo ' + tombo + '.', 'ok');
        anotarEtiqueta(tombo, nomeDaObra(obraEscolhida), dados.so_na_casa);

        // A obra continua escolhida: numa doação de três cópias, salva-se as
        // três seguidas sem procurar de novo. Editora e doador também ficam,
        // porque a pilha costuma ser da mesma edição e da mesma pessoa.
        // A marca e a observação não: descrevem ESTE livro, e o frágil é
        // justamente a exceção da pilha.
        formExemplar.elements.edicao.value = '';
        formExemplar.elements.so_na_casa.checked = false;
        formExemplar.elements.observacao_exemplar.value = '';
        formExemplar.elements.editora.focus();
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoExemplar, erro.message || 'Não consegui salvar.', 'erro');
      })
      .acrescentarExemplar(EU.sessao, obraEscolhida.id_titulo, dados);
  });

  // --------------------------------------------------- cadastro: alterar obra
  // Corrige a ficha de uma obra já cadastrada. Procura como em "Novo
  // exemplar" — título, autor, nº da obra ou tombo de qualquer exemplar dela —
  // e carrega a ficha inteira do servidor, porque a busca não traz sinopse,
  // ISBN nem observação.

  // Os campos da ficha, na mesma lista que o servidor aceita
  // (CAMPOS_EDITAVEIS_DA_OBRA, em catalogo.js).
  var CAMPOS_DA_FICHA = ['titulo', 'subtitulo', 'autor_ou_medium', 'autor_espiritual',
    'tradutor', 'isbn', 'categoria', 'serie', 'ordem_na_serie', 'sinopse',
    'link_online', 'observacao'];

  var formAlterarObra = $('#form-alterar-obra');
  var buscaObraAlterar = $('#busca-obra-alterar');
  var obrasAlterar = $('#obras-alterar');
  var estadoBuscaObraAlterar = $('#estado-busca-obra-alterar');
  var camposAlterarObra = $('#campos-alterar-obra');
  var estadoAlterarObra = $('#estado-alterar-obra');
  var obraEmEdicao = null;
  var procuraAlterarEmVoo = 0;
  var temporizadorObraAlterar = null;

  var ajustarAutoriaAlterar = ligarAutoria(formAlterarObra, $('#psicografada-alterar'),
    $('#campo-espiritual-alterar'), $('#rotulo-autoria-alterar'));

  // Renomear uma obra para o nome de outra cria a duplicata pelo outro lado.
  // O aviso é o mesmo de "Obra nova", sem contar a própria obra.
  var parecidasAlterar = vigiarParecidas(formAlterarObra, $('#parecidas-alterar'), {
    seIgual: 'Já existe outra obra com este título e subtítulo. Confira se não está ' +
      'fazendo uma segunda ficha para o mesmo livro:',
    seParecido: 'Há outra obra com título parecido. Confira se não é o mesmo livro:',
    ignorarId: function () { return obraEmEdicao && obraEmEdicao.id_titulo; }
  });

  buscaObraAlterar.addEventListener('input', function () {
    esquecerObraEmEdicao();
    clearTimeout(temporizadorObraAlterar);
    temporizadorObraAlterar = setTimeout(procurarObraParaAlterar, 300);
  });

  function esquecerObraEmEdicao() {
    obraEmEdicao = null;
    camposAlterarObra.classList.add('oculta');
    parecidasAlterar.esconder();
  }

  function procurarObraParaAlterar() {
    var termo = buscaObraAlterar.value.trim();
    obrasAlterar.innerHTML = '';
    if (!termo) { dizer(estadoBuscaObraAlterar, ''); return; }

    var esta = ++procuraAlterarEmVoo;
    dizer(estadoBuscaObraAlterar, 'Procurando…');

    google.script.run
      .withSuccessHandler(function (achados) {
        if (esta !== procuraAlterarEmVoo) return;
        obrasAlterar.innerHTML = '';
        if (!achados.length) {
          dizer(estadoBuscaObraAlterar, 'Nada encontrado. Tente parte do título, ou o nº da obra.');
          return;
        }
        dizer(estadoBuscaObraAlterar, '');
        achados.forEach(function (obra) {
          obrasAlterar.appendChild(itemObra(obra, carregarObraParaAlterar));
        });
      })
      .withFailureHandler(function (erro) {
        if (esta !== procuraAlterarEmVoo) return;
        dizer(estadoBuscaObraAlterar, erro.message || 'Não consegui buscar.', 'erro');
      })
      .buscarNoAcervo(termo);
  }

  function carregarObraParaAlterar(obra) {
    var esta = ++procuraAlterarEmVoo;
    obrasAlterar.innerHTML = '';
    dizer(estadoAlterarObra, '');
    dizer(estadoBuscaObraAlterar, 'Abrindo a ficha…');

    google.script.run
      .withSuccessHandler(function (ficha) {
        if (esta !== procuraAlterarEmVoo) return;
        obraEmEdicao = ficha;
        buscaObraAlterar.value = nomeDaObra(ficha);
        dizer(estadoBuscaObraAlterar, '');
        desenharEscolhida($('#alterando-obra'), 'Alterando', ficha);

        // Categoria gravada fora da lista (digitada na planilha) vira opção,
        // em vez de sumir: sem isso o select ficaria em branco, e salvar
        // qualquer outra mudança apagaria a categoria sem ninguém pedir.
        garantirOpcao($('#categoria-alterar'), ficha.categoria);

        CAMPOS_DA_FICHA.forEach(function (campo) {
          formAlterarObra.elements[campo].value = ficha[campo] || '';
        });
        $('#psicografada-alterar').checked = !!ficha.autor_espiritual;
        ajustarAutoriaAlterar();

        parecidasAlterar.esconder();
        camposAlterarObra.classList.remove('oculta');
        formAlterarObra.elements.titulo.focus();
      })
      .withFailureHandler(function (erro) {
        if (esta !== procuraAlterarEmVoo) return;
        dizer(estadoBuscaObraAlterar, erro.message || 'Não consegui abrir a ficha.', 'erro');
      })
      .verTituloParaEditar(EU.sessao, obra.id_titulo);
  }

  formAlterarObra.addEventListener('submit', function (evento) {
    evento.preventDefault();
    if (!obraEmEdicao) return;

    // Só vai o que mudou. O Log registra QUAIS campos foram alterados, e
    // "todos, sempre" não diria nada a quem for ler depois.
    var mudancas = {};
    CAMPOS_DA_FICHA.forEach(function (campo) {
      var valor = formAlterarObra.elements[campo].value.trim();
      if (valor !== (obraEmEdicao[campo] || '')) mudancas[campo] = valor;
    });

    if (!Object.keys(mudancas).length) {
      dizer(estadoAlterarObra, 'Nada mudou na ficha.');
      return;
    }

    var botao = $('#btn-salvar-alterar-obra');
    var id = obraEmEdicao.id_titulo;
    var nome = nomeDaObra({
      titulo: formAlterarObra.elements.titulo.value.trim(),
      subtitulo: formAlterarObra.elements.subtitulo.value.trim()
    });

    botao.disabled = true;
    dizer(estadoAlterarObra, 'Salvando…');

    google.script.run
      .withSuccessHandler(function () {
        botao.disabled = false;
        dizer(estadoAlterarObra, 'Obra nº ' + id + ' alterada: ' + nome + '.', 'ok');
        esquecerObraEmEdicao();
        buscaObraAlterar.value = '';
        buscaObraAlterar.focus();
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoAlterarObra, erro.message || 'Não consegui salvar.', 'erro');
      })
      .atualizarTitulo(EU.sessao, id, mudancas);
  });

  // ----------------------------------------------- cadastro: alterar exemplar
  // Tudo o que descreve este volume: editora, ano e edição digitados errado no
  // cadastro, e o que muda com o tempo — o livro envelhece, as páginas soltam,
  // e um exemplar que saía passa a ser só para ler na casa. Procura pelo
  // tombo, que é o número da etiqueta — quem altera está com o livro na mão.

  var formAlterarExemplar = $('#form-alterar-exemplar');
  var tomboAlterar = $('#tombo-alterar');
  var camposAlterarExemplar = $('#campos-alterar-exemplar');
  var estadoBuscaAlterar = $('#estado-busca-alterar');
  var estadoAlterarExemplar = $('#estado-alterar-exemplar');
  var exemplarEmEdicao = null;
  var alterarEmVoo = 0;
  var temporizadorAlterar = null;

  tomboAlterar.addEventListener('input', function () {
    exemplarEmEdicao = null;
    camposAlterarExemplar.classList.add('oculta');
    dizer(estadoAlterarExemplar, '');
    clearTimeout(temporizadorAlterar);
    temporizadorAlterar = setTimeout(carregarExemplarParaAlterar, 350);
  });

  function carregarExemplarParaAlterar() {
    var valor = tomboAlterar.value.trim();
    if (!valor) { dizer(estadoBuscaAlterar, ''); return; }

    var esta = ++alterarEmVoo;
    dizer(estadoBuscaAlterar, 'Procurando o tombo…');

    google.script.run
      .withSuccessHandler(function (dados) {
        if (esta !== alterarEmVoo) return;
        dizer(estadoBuscaAlterar, '');
        exemplarEmEdicao = dados;

        // A situação vai junto porque muda o que a marca faz: num livro que
        // está fora, ela só vale depois da devolução.
        var partes = [dados.titulo];
        if (dados.edicao) partes.push(dados.edicao);
        partes.push(dados.situacao);
        $('#alterando-exemplar').textContent =
          'Tombo ' + dados.tombo + ': ' + partes.join(' · ');
