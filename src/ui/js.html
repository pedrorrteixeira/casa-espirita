        formAlterarExemplar.elements.editora.value = dados.editora || '';
        formAlterarExemplar.elements.ano.value = dados.ano || '';
        formAlterarExemplar.elements.edicao.value = dados.numero_edicao || '';
        $('#estado-exemplar-alterar').value = dados.estado || 'bom';
        formAlterarExemplar.elements.so_na_casa.checked = dados.so_na_casa;
        formAlterarExemplar.elements.observacao_exemplar.value = dados.observacao || '';
        camposAlterarExemplar.classList.remove('oculta');
      })
      .withFailureHandler(function (erro) {
        if (esta !== alterarEmVoo) return;
        dizer(estadoBuscaAlterar, erro.message || 'Não consegui achar esse tombo.', 'erro');
      })
      .verExemplar(EU.sessao, valor);
  }

  formAlterarExemplar.addEventListener('submit', function (evento) {
    evento.preventDefault();
    if (!exemplarEmEdicao) return;

    var botao = $('#btn-salvar-alterar-exemplar');
    var tombo = exemplarEmEdicao.tombo;
    var soNaCasa = formAlterarExemplar.elements.so_na_casa.checked;
    var marcouAgora = soNaCasa && !exemplarEmEdicao.so_na_casa;
    var estaFora = exemplarEmEdicao.situacao === 'emprestado';

    var mudancas = {
      editora: formAlterarExemplar.elements.editora.value.trim(),
      ano: formAlterarExemplar.elements.ano.value.trim(),
      edicao: formAlterarExemplar.elements.edicao.value.trim(),
      estado: $('#estado-exemplar-alterar').value,
      so_na_casa: soNaCasa,
      observacao: formAlterarExemplar.elements.observacao_exemplar.value.trim()
    };

    botao.disabled = true;
    dizer(estadoAlterarExemplar, 'Salvando…');

    google.script.run
      .withSuccessHandler(function () {
        botao.disabled = false;

        var recado = 'Tombo ' + tombo + ' alterado.';
        if (marcouAgora && estaFora) {
          recado += ' Ele está emprestado: continua até a devolução, e daí em ' +
            'diante fica na casa.';
        }
        // A etiqueta é o aviso que o livro dá sozinho, sem ninguém digitar.
        if (marcouAgora) recado += ' Escreva "só para ler na casa" na etiqueta.';
        dizer(estadoAlterarExemplar, recado, 'ok');

        camposAlterarExemplar.classList.add('oculta');
        exemplarEmEdicao = null;
        tomboAlterar.value = '';
        tomboAlterar.focus();
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoAlterarExemplar, erro.message || 'Não consegui salvar.', 'erro');
      })
      .atualizarExemplar(EU.sessao, tombo, mudancas);
  });

  // ------------------------------------------------- cadastro: obras repetidas
  // O mesmo livro com duas fichas. Escolhe-se a que FICA; os exemplares da
  // outra passam para ela, e a outra some da busca sem sair da planilha.
  // Juntar se desfaz só pela planilha, então há sempre uma confirmação que
  // diz o que vai mudar.

  var listaRepetidas = $('#lista-repetidas');
  var estadoRepetidas = $('#estado-repetidas');
  var confirmarUniao = $('#confirmar-uniao');
  var uniaoPendente = null;
  var repetidasEmVoo = 0;
  var faltaColunaUnida = false;

  // O que a ficha que fica pode ganhar, na língua de quem lê. Autoria e série
  // vêm em bloco: o segundo campo de cada par não precisa de nome próprio.
  var NOMES_DOS_CAMPOS = {
    autor_ou_medium: 'autoria', serie: 'série', tradutor: 'tradutor', isbn: 'ISBN',
    categoria: 'categoria', sinopse: 'sinopse', link_online: 'link on-line',
    observacao: 'observação'
  };
  var MOTIVOS = {
    mesmo_titulo: 'Mesmo título e subtítulo',
    comeca_igual: 'Um título é o começo do outro',
    quase_igual: 'Título quase igual'
  };

  /** `recado` é o que acabou de ser feito; sai junto com a contagem nova. */
  function carregarRepetidas(recado) {
    var este = ++repetidasEmVoo;
    esconderConfirmacao();
    listaRepetidas.innerHTML = '';
    dizer(estadoRepetidas, 'Procurando obras repetidas…');

    google.script.run
      .withSuccessHandler(function (resposta) {
        if (este !== repetidasEmVoo) return;
        faltaColunaUnida = resposta.falta_coluna;
        desenharRepetidas(resposta.pares, typeof recado === 'string' ? recado : '');
      })
      .withFailureHandler(function (erro) {
        if (este !== repetidasEmVoo) return;
        dizer(estadoRepetidas, erro.message || 'Não consegui procurar.', 'erro');
      })
      .listarObrasRepetidas(EU.sessao);
  }

  function desenharRepetidas(pares, recado) {
    listaRepetidas.innerHTML = '';

    if (faltaColunaUnida) {
      dizer(estadoRepetidas, 'Para juntar, quem tem a planilha precisa antes rodar ' +
        'Biblioteca → Criar / atualizar estrutura da planilha. A lista já dá para conferir.', 'erro');
    } else {
      var contagem = pares.length
        ? plural(pares.length, 'par de obras pode ser o mesmo livro.',
            'pares de obras podem ser o mesmo livro.')
        : 'Nenhuma obra parece repetida.';
      dizer(estadoRepetidas, recado ? recado + ' ' + contagem : contagem, recado ? 'ok' : '');
    }

    pares.forEach(function (par) {
      var item = document.createElement('li');
      item.className = 'par-repetido';
      item.appendChild(elemento('p', MOTIVOS[par.motivo] || '', 'par-motivo'));
      item.appendChild(cartaoDoPar(par.a, par.b, item));
      item.appendChild(cartaoDoPar(par.b, par.a, item));

      var diferentes = document.createElement('button');
      diferentes.type = 'button';
      diferentes.className = 'discreto';
      diferentes.textContent = 'São livros diferentes — tirar da lista';
      diferentes.addEventListener('click', function () {
        marcarDiferentes(par, item, diferentes);
      });
      item.appendChild(diferentes);

      listaRepetidas.appendChild(item);
    });
  }

  /** Uma das duas fichas do par, com o botão de ficar com ela. */
  function cartaoDoPar(obra, outra, item) {
    var cartao = document.createElement('div');
    cartao.className = 'parecida';
    cartao.appendChild(elemento('strong', nomeDaObra(obra)));
    cartao.appendChild(elemento('small', detalhesDaObra(obra)));

    var botao = document.createElement('button');
    botao.type = 'button';
    botao.textContent = 'Ficar com esta';
    botao.disabled = faltaColunaUnida;
    botao.addEventListener('click', function () {
      prepararUniao(obra.id_titulo, outra.id_titulo, item);
    });
    cartao.appendChild(botao);
    return cartao;
  }

  /** Pergunta ao servidor o que juntar vai fazer, e mostra antes de fazer. */
  function prepararUniao(idFica, idSai, lugar) {
    esconderConfirmacao();
    dizer(estadoRepetidas, 'Conferindo…');

    google.script.run
      .withSuccessHandler(function (plano) {
        dizer(estadoRepetidas, '');
        uniaoPendente = plano;
        desenharConfirmacao(plano);
        lugar.appendChild(confirmarUniao);
        confirmarUniao.classList.remove('oculta');
        confirmarUniao.scrollIntoView({ block: 'nearest' });
      })
      .withFailureHandler(function (erro) {
        dizer(estadoRepetidas, erro.message || 'Não consegui conferir.', 'erro');
      })
      .prepararUniao(EU.sessao, idFica, idSai);
  }

  function desenharConfirmacao(plano) {
    var detalhe = $('#uniao-detalhe');
    detalhe.innerHTML = '';

    detalhe.appendChild(elemento('p', 'Fica: ' + nomeDaObra(plano.fica) +
      ' (obra nº ' + plano.fica.id_titulo + ').'));
    detalhe.appendChild(elemento('p', 'Sai: ' + nomeDaObra(plano.sai) +
      ' (obra nº ' + plano.sai.id_titulo + '). Some da busca e continua guardada na planilha.'));

    detalhe.appendChild(elemento('p', plano.tombos.length
      ? (plano.tombos.length === 1 ? 'Passa 1 exemplar' : 'Passam ' + plano.tombos.length +
          ' exemplares') + ': ' + (plano.tombos.length === 1 ? 'tombo ' : 'tombos ') +
        plano.tombos.join(', ') +
        '. As etiquetas não mudam.'
      : 'A ficha que sai não tem exemplares.'));

    var ganha = plano.completar
      .map(function (campo) { return NOMES_DOS_CAMPOS[campo]; })
      .filter(function (nome) { return nome; });
    if (ganha.length) {
      detalhe.appendChild(elemento('p', 'A ficha que fica estava sem ' + ganha.join(', ') +
        ', e recebe da outra.', 'dica'));
    }
  }

  function esconderConfirmacao() {
    uniaoPendente = null;
    confirmarUniao.classList.add('oculta');
    // Volta para o lugar de origem: o par onde estava pode ser redesenhado.
    $('#bloco-repetidas').appendChild(confirmarUniao);
  }

  $('#btn-cancelar-uniao').addEventListener('click', esconderConfirmacao);

  $('#btn-juntar').addEventListener('click', function () {
    if (!uniaoPendente) return;
    var plano = uniaoPendente;
    var botao = this;
    botao.disabled = true;
    dizer(estadoRepetidas, 'Juntando…');

    google.script.run
      .withSuccessHandler(function (feito) {
        botao.disabled = false;
        $('#uniao-fica').value = '';
        $('#uniao-sai').value = '';
        carregarRepetidas('Pronto: a obra nº ' + feito.sai + ' foi unida à nº ' +
          feito.fica + ' (' + feito.nome + ')' +
          (feito.tombos.length ? ', com ' + plural(feito.tombos.length, 'exemplar', 'exemplares') : '') +
          '.');
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoRepetidas, erro.message || 'Não consegui juntar.', 'erro');
      })
      .juntarObras(EU.sessao, plano.fica.id_titulo, plano.sai.id_titulo);
  });

  function marcarDiferentes(par, item, botao) {
    botao.disabled = true;
    google.script.run
      .withSuccessHandler(function () {
        if (confirmarUniao.parentNode === item) esconderConfirmacao();
        listaRepetidas.removeChild(item);
        dizer(estadoRepetidas, 'Certo: “' + nomeDaObra(par.a) + '” e “' + nomeDaObra(par.b) +
          '” saíram da lista como livros diferentes.', 'ok');
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoRepetidas, erro.message || 'Não consegui marcar.', 'erro');
      })
      .marcarObrasDiferentes(EU.sessao, par.a.id_titulo, par.b.id_titulo);
  }

  // Pelo número: para o par que a lista não pegou.
  $('#btn-conferir-uniao').addEventListener('click', function () {
    var fica = $('#uniao-fica').value.trim();
    var sai = $('#uniao-sai').value.trim();
    if (!fica || !sai) {
      dizer(estadoRepetidas, 'Escreva o número das duas obras.', 'erro');
      return;
    }
    prepararUniao(Number(fica), Number(sai), $('#lugar-confirmar-numero'));
  });

  // ------------------------------------------------ cadastro: relatório do acervo
  // Tudo o que a casa tem, obra por obra, com os exemplares embaixo. Para
  // conferir na tela e para imprimir — o Imprimir do navegador também salva
  // em PDF, então não há arquivo nenhum para gerar nem para ficar velho.

  var relatorioConteudo = $('#relatorio-conteudo');
  var estadoRelatorio = $('#estado-relatorio');
  var botaoImprimir = $('#btn-imprimir-relatorio');
  var relatorioEmVoo = 0;

  function carregarRelatorio() {
    var este = ++relatorioEmVoo;
    relatorioConteudo.innerHTML = '';
    botaoImprimir.disabled = true;
    dizer(estadoRelatorio, 'Montando o relatório…');

    google.script.run
      .withSuccessHandler(function (relatorio) {
        if (este !== relatorioEmVoo) return;
        dizer(estadoRelatorio, '');
        desenharRelatorio(relatorio);
        botaoImprimir.disabled = !relatorio.obras.length;
      })
      .withFailureHandler(function (erro) {
        if (este !== relatorioEmVoo) return;
        dizer(estadoRelatorio, erro.message || 'Não consegui montar o relatório.', 'erro');
      })
      .relatorioDoAcervo(EU.sessao);
  }

  function desenharRelatorio(relatorio) {
    var r = relatorio.resumo;

    // O cabeçalho vai DENTRO do conteúdo, e não no topo da tela: o topo some
    // na impressão, e o papel precisa dizer de onde é e de quando.
    relatorioConteudo.appendChild(elemento('h2', 'Relatório do acervo', 'rel-titulo'));
    relatorioConteudo.appendChild(elemento('p',
      (relatorio.casa ? relatorio.casa + ' · ' : '') + 'gerado em ' + relatorio.gerado_em,
      'meta'));

    if (!relatorio.obras.length) {
      relatorioConteudo.appendChild(elemento('p',
        'A casa ainda não tem nenhum exemplar cadastrado.', 'dica'));
      return;
    }

    var situacoes = [plural(r.disponiveis, 'disponível', 'disponíveis')];
    if (r.emprestados) situacoes.push(plural(r.emprestados, 'emprestado', 'emprestados'));
    if (r.so_na_casa) situacoes.push(r.so_na_casa + ' só para ler na casa');
    relatorioConteudo.appendChild(elemento('p',
      plural(r.obras, 'obra', 'obras') + ' · ' +
      plural(r.exemplares, 'exemplar', 'exemplares') + ': ' + situacoes.join(', ') + '.',
      'rel-resumo'));

    // O que não entra na lista, dito — senão o total do papel não fecha com
    // a planilha, e ninguém sabe por quê.
    var fora = [];
    if (r.baixados) fora.push(plural(r.baixados, 'exemplar baixado', 'exemplares baixados'));
    if (r.sem_obra) {
      fora.push(plural(r.sem_obra, 'exemplar aponta', 'exemplares apontam') +
        ' para obra que não existe — avise quem cuida da planilha');
    }
    if (fora.length) {
      relatorioConteudo.appendChild(elemento('p', 'Fora da lista: ' + fora.join('; ') + '.', 'dica'));
    }

    relatorio.obras.forEach(function (obra) {
      relatorioConteudo.appendChild(obraDoRelatorio(obra));
    });
  }

  function obraDoRelatorio(obra) {
    var bloco = document.createElement('article');
    bloco.className = 'rel-obra';

    bloco.appendChild(elemento('h3', nomeDaObra(obra)));

    var meta = [];
    if (obra.autoria) meta.push(obra.autoria);
    if (obra.categoria) meta.push(obra.categoria);
    if (obra.serie) meta.push(obra.serie + (obra.ordem_na_serie ? ' nº ' + obra.ordem_na_serie : ''));
    if (meta.length) bloco.appendChild(elemento('p', meta.join(' · '), 'meta'));

    var lista = document.createElement('ul');
    lista.className = 'rel-exemplares';
    obra.exemplares.forEach(function (exemplar) {
      var item = document.createElement('li');
      item.appendChild(elemento('span', String(exemplar.tombo), 'rel-tombo'));

      // O resto numa coluna só, depois do tombo: no celular a linha quebra,
      // e o que desce fica alinhado em vez de voltar para baixo do número.
      var corpo = elemento('span', '', 'rel-corpo');
      item.appendChild(corpo);

      var descricao = [exemplar.edicao, exemplar.estado].filter(function (p) { return p; });
      if (descricao.length) corpo.appendChild(elemento('span', descricao.join(' · '), 'rel-edicao'));

      var classe = exemplar.situacao === 'emprestado' ? 'emprestado'
        : exemplar.situacao === 'só para ler na casa' ? 'so_na_casa'
        : 'disponivel';
      var situacao = exemplar.situacao === 'emprestado' && exemplar.previsao
        ? 'emprestado até ' + exemplar.previsao
        : exemplar.situacao;
      corpo.appendChild(elemento('span', situacao, 'rel-situacao ' + classe));

      if (exemplar.observacao) {
        corpo.appendChild(elemento('span', exemplar.observacao, 'rel-observacao'));
      }
      lista.appendChild(item);
    });
    bloco.appendChild(lista);

    return bloco;
  }

  function plural(quantos, um, varios) {
    return quantos + ' ' + (quantos === 1 ? um : varios);
  }

  $('#btn-atualizar-relatorio').addEventListener('click', carregarRelatorio);

  // ---------------------------------------------------- cadastro: cartaz do QR
  // O cartaz aponta para `url_sistema`, do Config. Sem ele não há o que pôr no
  // QR, e o link fica escondido em vez de abrir um cartaz que não funciona.
  if (URL_SISTEMA) {
    $('#link-cartaz').href = URL_SISTEMA + (URL_SISTEMA.indexOf('?') === -1 ? '?' : '&') + 'cartaz=1';
    $('#link-cartaz').classList.remove('oculta');
  }

  // Na impressão sai só o relatório: o CSS de impressão esconde o resto da
  // página enquanto esta classe estiver no <body>.
  botaoImprimir.addEventListener('click', function () {
    document.body.classList.add('imprimindo-relatorio');
    window.print();
  });
  window.addEventListener('afterprint', function () {
    document.body.classList.remove('imprimindo-relatorio');
  });


  // ---------------------------------------------------------- campos guiados
  // Três comportamentos que existem pelo mesmo motivo: o que se digita à mão
  // ao longo de anos, por gente diferente, acaba inconsistente — e a
  // inconsistência não dá erro, só faz a busca deixar de achar.

  /**
   * Campos que só aceitam dígito.
   *
   * Filtra no `input`, e não só no `pattern`: o `pattern` avisa depois de
   * digitar, este impede na hora. Num campo de ano, "19 78" com espaço é o
   * erro que vira um ano que nenhuma busca acha.
   */
  document.querySelectorAll('[data-so-digitos]').forEach(function (campo) {
    campo.addEventListener('input', function () {
      var limpo = campo.value.replace(/\D/g, '');
      if (limpo !== campo.value) campo.value = limpo;
    });
  });

  /**
   * Telefone com máscara, escrita enquanto se digita.
   *
   * A máscara é APRESENTAÇÃO: quem compara contato joga fora tudo que não é
   * dígito. Por isso ela nunca quebra o que já está gravado, e por isso pode
   * ser generosa — número torto entra como está, em vez de ser recusado. A
   * casa perder o contato de quem quis dar é pior que guardá-lo torto.
   */
  function mascararTelefone(campo) {
    var antes = campo.value;
    var d = antes.replace(/\D/g, '').slice(0, 11);

    var texto = d;
    if (d.length > 2) {
      var corte = d.length > 10 ? 7 : 6;
      texto = '(' + d.slice(0, 2) + ') ' +
        (d.length > 6 ? d.slice(2, corte) + '-' + d.slice(corte) : d.slice(2));
    }

    if (texto !== antes) campo.value = texto;
  }

  document.querySelectorAll('[data-telefone]').forEach(function (campo) {
    campo.addEventListener('input', function () { mascararTelefone(campo); });
  });

  /**
   * Sugestões vindas do que já foi cadastrado.
   *
   * Carregadas uma vez, ao entrar — e só para quem cataloga, porque a lista de
   * doadores é nome de pessoa. Falhar aqui não atrapalha nada: sem sugestão, o
   * campo continua sendo texto livre.
   */
  function carregarSugestoes() {
    if (!EU.sessao || !podeVer('cadastrar_obra')) return;

    google.script.run
      .withSuccessHandler(function (sugestoes) {
        [['editora', 'lista-editora'],
         ['serie', 'lista-serie'],
         ['tradutor', 'lista-tradutor'],
         ['doado_por', 'lista-doado-por'],
         ['autor_ou_medium', 'lista-autor-ou-medium'],
         ['autor_espiritual', 'lista-autor-espiritual']
        ].forEach(function (par) {
          var lista = document.getElementById(par[1]);
          if (!lista) return;
          lista.innerHTML = '';
          (sugestoes[par[0]] || []).forEach(function (valor) {
            var opcao = document.createElement('option');
            opcao.value = valor;
            lista.appendChild(opcao);
          });
        });
      })
      .withFailureHandler(function () {
        // Sem sugestão o cadastro funciona igual. Não vale um aviso na tela.
      })
      .lerSugestoesDeCadastro(EU.sessao);
  }

  // ------------------------------------------------------------- auxiliares
  /**
   * Diz o que conferir na autoria. O Google marca o autor espiritual com
   * "(Espírito)" e o sistema separa sozinho — mas quando a marca não vem, o
   * médium acaba no campo Autor, e aí alguém precisa mover.
   */
  function recadoDeAutoria(livro) {
    // A consulta preencheu autor_espiritual? Então é psicografia, e a caixa
    // tem que refletir isso — senão o rótulo diria "Autor" sobre um médium.
    caixaPsicografada.checked = !!livro.autor_espiritual;
    ajustarAutoria();
    formulario.elements.autor_espiritual.value = livro.autor_espiritual || '';

    if (livro.autor_espiritual) {
      return 'Psicografia reconhecida: autor espiritual e médium foram ' +
        'separados. Confira, e escolha a categoria.';
    }
    return 'Confira a autoria — se esta obra for psicografada, o Google não ' +
      'marcou, e o nome no campo Autor precisa ir para Médium.';
  }

  /**
   * Título e subtítulo juntos — o mesmo que `nomeDaObra` em dominio.js. É o
   * subtítulo que separa livros de mesmo título, como o programa fundamental
   * e o complementar do ESDE; mostrar só o título faz os dois parecerem um.
   */
  function nomeDaObra(obra) {
    var titulo = String(obra.titulo || '').trim();
    var subtitulo = String(obra.subtitulo || '').trim();
    return subtitulo ? titulo + ' — ' + subtitulo : titulo;
  }

  /**
   * A linha de baixo de uma obra numa lista de escolha: autoria, número da
   * obra e o que a casa JÁ tem dela — quantos exemplares e de quais edições.
   * É o que evita cadastrar a mesma edição duas vezes achando que era outra,
   * e é a informação que a pessoa tem na mão para comparar.
   */
  function detalhesDaObra(obra) {
    var partes = [];
    if (obra.por_numero && obra.por_numero.tipo === 'tombo') {
      partes.push('tem o tombo ' + obra.por_numero.numero);
    }
    if (obra.autoria) partes.push(obra.autoria);
    partes.push('obra nº ' + obra.id_titulo);
    partes.push(!obra.total ? 'a casa não tem exemplar'
      : obra.total === 1 ? '1 exemplar'
      : obra.total + ' exemplares');
    if (obra.edicoes && obra.edicoes.length) partes.push(obra.edicoes.join(' / '));
    return partes.join(' · ');
  }

  /**
   * A caixa que diz de qual obra se trata, acima dos campos. O nome inteiro
   * numa linha própria, em destaque, e os detalhes embaixo: era uma linha só,
   * "título — autoria", e o subtítulo não aparecia.
   */
  function desenharEscolhida(caixa, rotulo, obra) {
    caixa.innerHTML = '';
    caixa.appendChild(elemento('span', rotulo, 'escolhida-rotulo'));
    caixa.appendChild(elemento('strong', nomeDaObra(obra), 'escolhida-nome'));
    caixa.appendChild(elemento('small', detalhesDaObra(obra), 'escolhida-detalhe'));
  }

  /** Acrescenta ao select uma opção que ele não tem, para o valor não sumir. */
  function garantirOpcao(select, valor) {
    if (!valor) return;
    var existe = Array.prototype.some.call(select.options, function (opcao) {
      return opcao.value === valor;
    });
    if (existe) return;
    var opcao = document.createElement('option');
    opcao.value = valor;
    opcao.textContent = valor;
    select.appendChild(opcao);
  }

  function elemento(marca, texto, classe) {
    var no = document.createElement(marca);
    no.textContent = texto;          // textContent, nunca innerHTML: o acervo
    if (classe) no.className = classe;  // é digitado por gente e pode ter < e &
    return no;
  }

  function preencherSelect(select, valores, padrao) {
    select.innerHTML = '';
    valores.forEach(function (valor) {
      var opcao = document.createElement('option');
      opcao.value = valor;
      opcao.textContent = valor;
      if (valor === padrao) opcao.selected = true;
      select.appendChild(opcao);
    });
  }

  function dizer(onde, texto, classe) {
    onde.textContent = texto;
    onde.className = 'estado' + (classe ? ' ' + classe : '');
  }

  // Última coisa: a sessão guardada pode ter vencido com a aba fechada, e é
  // isto que decide quais abas aparecem.
  conferirSessao();
})();
</script>
