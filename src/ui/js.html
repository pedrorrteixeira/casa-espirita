<!-- ui/js.html — JavaScript do cliente.

     Fala com o servidor só por `google.script.run`. Sem framework, sem
     dependência externa: o HtmlService serve isto de um sandbox e cada
     biblioteca a mais é mais uma coisa para um voluntário manter daqui a
     cinco anos. -->
<script>
(function () {
  'use strict';

  var $ = function (selecao) { return document.querySelector(selecao); };

  /**
   * Quem está usando o sistema.
   *
   * A sessão vem do link mágico, trocada pelo servidor no carregamento, e fica
   * aqui — nunca numa URL. URL vai parar em histórico, print e grupo de
   * WhatsApp.
   *
   * Esconder aba por perfil é conveniência, NÃO segurança: quem abrir o
   * console do navegador chama google.script.run direto. Quem protege é a
   * guarda no servidor; isto aqui só evita mostrar botão que vai dar erro.
   */
  var EU = { sessao: '', nome: '', perfil: '' };

  var entrada = ENTRADA_DO_SERVIDOR;
  if (entrada) {
    EU = { sessao: entrada.sessao, nome: entrada.nome, perfil: entrada.perfil };
    try { localStorage.setItem('sessao', EU.sessao); } catch (erro) {}
    // Tira o código da barra de endereços: ele já foi usado, e deixá-lo à
    // mostra convida a compartilhar um link que não funciona mais.
    try {
      history.replaceState(null, '', location.pathname);
    } catch (erro) {}
  } else {
    try { EU.sessao = localStorage.getItem('sessao') || ''; } catch (erro) {}
  }

  function podeVer(acao) {
    var ordem = ['consulta', 'atendente', 'bibliotecario', 'admin'];
    var exige = {
      emprestar: 'atendente', ver_atrasos: 'atendente', definir_tema: 'atendente',
      cadastrar_obra: 'bibliotecario', editar_pessoa: 'bibliotecario'
    };
    return ordem.indexOf(EU.perfil) >= ordem.indexOf(exige[acao] || 'admin');
  }

  function mostrarIdentidade() {
    var entrou = !!EU.perfil;
    // Nome e perfil em elementos separados: em tela estreita o perfil sai e o
    // nome fica, porque saber COM QUEM se está gravando é o que importa.
    $('#meu-nome').textContent = entrou ? EU.nome : '';
    $('#meu-perfil').textContent = entrou ? ' · ' + EU.perfil : '';
    $('#btn-entrar').classList.toggle('oculta', entrou);
    $('#btn-sair').classList.toggle('oculta', !entrou);

    document.querySelectorAll('.aba[data-exige]').forEach(function (aba) {
      aba.classList.toggle('oculta', !podeVer(aba.dataset.exige));
    });
  }

  /** Sessão guardada pode ter vencido enquanto a aba estava fechada. */
  function conferirSessao() {
    if (!EU.sessao) { mostrarIdentidade(); return; }

    google.script.run
      .withSuccessHandler(function (quem) {
        if (quem) { EU.nome = quem.nome; EU.perfil = quem.perfil; }
        else { esquecerSessao(); }
        mostrarIdentidade();
      })
      .withFailureHandler(function () { esquecerSessao(); mostrarIdentidade(); })
      .verSessao(EU.sessao);
  }

  function esquecerSessao() {
    EU = { sessao: '', nome: '', perfil: '' };
    try { localStorage.removeItem('sessao'); } catch (erro) {}
  }

  $('#btn-entrar').addEventListener('click', function () {
    irPara('entrada');
  });

  $('#btn-sair').addEventListener('click', function () {
    var sessao = EU.sessao;
    esquecerSessao();
    mostrarIdentidade();
    irPara('busca');
    google.script.run.encerrarSessao(sessao);
  });

  $('#form-entrar').addEventListener('submit', function (evento) {
    evento.preventDefault();
    var botao = $('#btn-pedir-link');
    botao.disabled = true;
    dizer($('#estado-entrada'), 'Enviando…');

    google.script.run
      .withSuccessHandler(function (recado) {
        botao.disabled = false;
        dizer($('#estado-entrada'), recado, 'ok');
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer($('#estado-entrada'), erro.message || 'Não consegui enviar.', 'erro');
      })
      .pedirAcesso(this.elements.email.value);
  });

  /** Troca de visão por código, para os botões que não são aba. */
  function irPara(visao) {
    document.querySelectorAll('.aba').forEach(function (aba) {
      aba.classList.toggle('ativa', aba.dataset.visao === visao);
    });
    document.querySelectorAll('.visao').forEach(function (secao) {
      secao.classList.toggle('oculta', secao.id !== 'visao-' + visao);
    });
  }

  // Campos que a consulta ao Google governa. Ela sobrescreve todos, inclusive
  // com vazio: manter metade do livro anterior montaria uma ficha com dados de
  // duas obras diferentes.
  var CAMPOS_DA_CONSULTA = ['titulo', 'subtitulo', 'autor_ou_medium',
    'autor_espiritual', 'editora', 'ano', 'sinopse'];

  // ---------------------------------------------------------------- navegação
  document.querySelectorAll('.aba').forEach(function (aba) {
    aba.addEventListener('click', function () {
      document.querySelectorAll('.aba').forEach(function (outra) {
        outra.classList.toggle('ativa', outra === aba);
      });
      document.querySelectorAll('.visao').forEach(function (visao) {
        visao.classList.toggle('oculta', visao.id !== 'visao-' + aba.dataset.visao);
      });
    });
  });

  // ------------------------------------------------------------------- busca
  var termo = $('#termo');
  var estadoBusca = $('#estado-busca');
  var resultados = $('#resultados');
  var buscaEmVoo = 0;

  $('#form-busca').addEventListener('submit', function (evento) {
    evento.preventDefault();
    buscar(termo.value);
  });

  // Busca enquanto digita, com folga de 300ms. Sem isso, cada tecla vira uma
  // chamada ao servidor e a lista pisca.
  var temporizador = null;
  termo.addEventListener('input', function () {
    clearTimeout(temporizador);
    temporizador = setTimeout(function () { buscar(termo.value); }, 300);
  });

  function buscar(texto) {
    if (!texto.trim()) {
      resultados.innerHTML = '';
      dizer(estadoBusca, '');
      return;
    }

    // Resposta de busca antiga não pode sobrescrever resposta nova: quem
    // digita rápido dispara várias e elas voltam fora de ordem.
    var estaBusca = ++buscaEmVoo;
    dizer(estadoBusca, 'Procurando…');

    google.script.run
      .withSuccessHandler(function (achados) {
        if (estaBusca !== buscaEmVoo) return;
        mostrarResultados(achados);
      })
      .withFailureHandler(function (erro) {
        if (estaBusca !== buscaEmVoo) return;
        resultados.innerHTML = '';
        dizer(estadoBusca, erro.message || 'Não consegui buscar agora.', 'erro');
      })
      .buscarNoAcervo(texto);
  }

  function mostrarResultados(achados) {
    resultados.innerHTML = '';

    if (!achados.length) {
      dizer(estadoBusca, 'Nada encontrado. Tente outra palavra, ou parte dela.');
      return;
    }

    dizer(estadoBusca, achados.length === 1 ? '1 obra' : achados.length + ' obras');

    achados.forEach(function (obra) {
      var item = document.createElement('li');
      item.className = 'resultado';

      item.appendChild(elemento('h2', obra.titulo +
        (obra.subtitulo ? ' — ' + obra.subtitulo : '')));

      if (obra.autoria) item.appendChild(elemento('p', obra.autoria, 'autoria'));

      var meta = [];
      if (obra.categoria) meta.push(obra.categoria);
      if (obra.serie) {
        meta.push(obra.serie + (obra.ordem_na_serie ? ' nº ' + obra.ordem_na_serie : ''));
      }
      // Editora e ano vêm dos exemplares e podem ser vários.
      if (obra.edicoes && obra.edicoes.length) meta.push(obra.edicoes.join(' / '));
      if (meta.length) item.appendChild(elemento('p', meta.join(' · '), 'meta'));

      var selo = elemento('span', textoDeDisponibilidade(obra), 'selo ' + obra.estado);
      item.appendChild(selo);

      resultados.appendChild(item);
    });
  }

  /**
   * Nunca mostra com quem o livro está — o servidor sequer manda esse dado.
   * Aqui é só a redação.
   */
  function textoDeDisponibilidade(obra) {
    if (obra.estado === 'sem_exemplar') return 'a casa não tem exemplar';

    if (obra.estado === 'disponivel') {
      return obra.total > 1
        ? 'disponível (' + obra.disponiveis + ' de ' + obra.total + ')'
        : 'disponível';
    }

    return obra.previsao
      ? 'emprestado — previsão ' + obra.previsao
      : 'emprestado';
  }

  // ---------------------------------------------------------------- cadastro
  var formulario = $('#form-cadastro');
  var estadoCadastro = $('#estado-cadastro');
  var caixaExemplar = formulario.elements.criar_exemplar;
  var camposExemplar = $('#campos-exemplar');

  google.script.run
    .withSuccessHandler(function (listas) {
      preencherSelect($('#categoria'), listas.categorias, 'doutrinário');
      preencherSelect($('#estado-exemplar'), listas.estados, 'bom');
    })
    .withFailureHandler(function () {
      dizer(estadoCadastro, 'Não consegui carregar as listas de categoria.', 'erro');
    })
    .lerListasDeCadastro();

  caixaExemplar.addEventListener('change', function () {
    camposExemplar.classList.toggle('oculta', !caixaExemplar.checked);
  });

  /**
   * "Obra psicografada" decide o papel do campo de autoria.
   *
   * O banco tem uma coluna só para os dois: obra de autor e psicografia nunca
   * têm os dois preenchidos. Quem diz qual papel aquele nome exerce é o campo
   * `autor_espiritual` estar cheio ou vazio — então a caixa só muda o rótulo
   * e mostra ou esconde o campo do espírito.
   */
  var caixaPsicografada = $('#psicografada');
  var campoEspiritual = $('#campo-espiritual');
  var rotuloAutoria = $('#rotulo-autoria');

  function ajustarAutoria() {
    var psicografada = caixaPsicografada.checked;
    campoEspiritual.classList.toggle('oculta', !psicografada);
    rotuloAutoria.childNodes[0].nodeValue = psicografada ? '\n          Médium\n          ' : '\n          Autor\n          ';
    formulario.elements.autor_ou_medium.placeholder = psicografada
      ? 'Francisco Cândido Xavier (Chico Xavier)'
      : 'Allan Kardec';
    // Desmarcar significa "não é psicografia": o espírito tem que sair junto,
    // senão fica um autor_espiritual órfão mudando o sentido da ficha.
    if (!psicografada) formulario.elements.autor_espiritual.value = '';
  }

  caixaPsicografada.addEventListener('change', ajustarAutoria);
  ajustarAutoria();

  // ISBN: atalho, não caminho principal. Não achar é normal e não é erro.
  $('#btn-isbn').addEventListener('click', function () {
    var campo = formulario.elements.isbn;
    var aviso = $('#aviso-isbn');
    var botao = this;

    if (!campo.value.trim()) {
      aviso.textContent = 'Digite o ISBN primeiro.';
      return;
    }

    botao.disabled = true;
    aviso.textContent = 'Consultando…';

    google.script.run
      .withSuccessHandler(function (livro) {
        botao.disabled = false;
        if (!livro) {
          // O ISBN vai no recado de propósito: sem ele, "não achei" repetido
          // é indistinguível de "a consulta nem saiu".
          // Aponta o outro caminho em vez de mandar desistir: edição antiga
          // sem ISBN indexado costuma ser achada pelo título.
          aviso.textContent = 'ISBN ' + campo.value.trim() + ': não achei. ' +
            'Escreva o título abaixo e use "Procurar no Google" — edição ' +
            'antiga costuma aparecer pelo título mesmo sem ISBN.';
          return;
        }
        // Sobrescreve, inclusive com vazio. Antes só preenchia campo vazio, e
        // o efeito era pior do que o problema que evitava: consultar um
        // segundo ISBN não mudava nada, porque os campos já estavam cheios do
        // primeiro. Parecia que a consulta devolvia sempre o mesmo livro.
        //
        // Limpar o que a nova resposta não traz é de propósito: manter o
        // subtítulo do livro anterior montaria uma ficha Frankenstein com
        // dados de duas obras, e ninguém perceberia.
        CAMPOS_DA_CONSULTA.forEach(function (campoNome) {
          formulario.elements[campoNome].value = livro[campoNome] || '';
        });

        aviso.textContent = 'Preenchido com o ISBN ' + livro.isbn + ': "' +
          livro.titulo + '". ' + recadoDeAutoria(livro);
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        aviso.textContent = erro.message || 'Não consegui consultar agora.';
      })
      .buscarPorIsbn(EU.sessao, campo.value);
  });

  // Busca por título: saída para quando o ISBN não acha, o que é comum em
  // editora brasileira. Não preenche sozinho — mostra candidatos e a
  // bibliotecária escolhe, olhando editora e ano.
  $('#btn-titulo').addEventListener('click', function () {
    var aviso = $('#aviso-titulo');
    var lista = $('#candidatos');
    var botao = this;
    var titulo = formulario.elements.titulo.value.trim();

    lista.innerHTML = '';
    if (titulo.length < 3) {
      aviso.textContent = 'Escreva ao menos três letras do título.';
      return;
    }

    botao.disabled = true;
    aviso.textContent = 'Procurando…';

    google.script.run
      .withSuccessHandler(function (livros) {
        botao.disabled = false;
        if (!livros.length) {
          aviso.textContent = 'Nada encontrado com esse título. Preencha à mão.';
          return;
        }
        aviso.textContent = livros.length + ' resultado(s). Escolha a edição ' +
          'certa pela editora e pelo ano:';
        livros.forEach(function (livro) {
          lista.appendChild(itemCandidato(livro, aviso, lista));
        });
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        aviso.textContent = erro.message || 'Não consegui consultar agora.';
      })
      .buscarLivrosPorTitulo(EU.sessao, titulo, formulario.elements.autor_ou_medium.value);
  });

  function itemCandidato(livro, aviso, lista) {
    var item = document.createElement('li');
    var botao = document.createElement('button');
    botao.type = 'button';
    botao.className = 'candidato';

    botao.appendChild(elemento('strong',
      livro.titulo + (livro.subtitulo ? ' — ' + livro.subtitulo : '')));

    // A autoria aparece já resolvida: em psicografia `autor` vem vazio, e
    // mostrar só ele deixaria o candidato sem identificação nenhuma.
    var quem = livro.autor_espiritual
      ? livro.autor_espiritual + (livro.autor_ou_medium ? ' / méd. ' + livro.autor_ou_medium : '')
      : livro.autor_ou_medium;

    var detalhes = [quem, livro.editora, livro.ano, livro.isbn]
      .filter(function (parte) { return parte; })
      .join(' · ');
    botao.appendChild(elemento('small', detalhes || 'sem outros dados'));

    botao.addEventListener('click', function () {
      CAMPOS_DA_CONSULTA.concat(['isbn']).forEach(function (campo) {
        formulario.elements[campo].value = livro[campo] || '';
      });
      lista.innerHTML = '';
      aviso.textContent = recadoDeAutoria(livro);
      formulario.elements.categoria.focus();   // é o que o Google não traz
    });

    item.appendChild(botao);
    return item;
  }

  // --- duplicata -------------------------------------------------------------
  var painelDuplicata = $('#painel-duplicata');
  var duplicataDetalhe = $('#duplicata-detalhe');

  function esconderDuplicata() {
    painelDuplicata.classList.add('oculta');
  }

  formulario.addEventListener('input', esconderDuplicata);

  formulario.addEventListener('submit', function (evento) {
    evento.preventDefault();
    esconderDuplicata();

    var botao = $('#btn-salvar');
    botao.disabled = true;
    dizer(estadoCadastro, 'Conferindo se já existe…');

    // Pergunta ANTES de salvar para poder oferecer a saída certa. O servidor
    // recusa de novo na hora de gravar, dentro da trava — este aviso é
    // conveniência, não a garantia.
    google.script.run
      .withSuccessHandler(function (existente) {
        if (!existente) {
          salvar(false);
          return;
        }
        botao.disabled = false;
        dizer(estadoCadastro, '');
        mostrarDuplicata(existente);
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoCadastro, erro.message || 'Não consegui conferir.', 'erro');
      })
      .verificarTituloExistente(EU.sessao, dadosDoFormulario().dados);
  });

  function mostrarDuplicata(existente) {
    var partes = [existente.autoria];
    if (existente.edicoes && existente.edicoes.length) {
      partes.push(existente.edicoes.join(' / '));
    }
    partes.push(existente.total === 1
      ? '1 exemplar no acervo'
      : existente.total + ' exemplares no acervo');

    duplicataDetalhe.textContent = '"' + existente.titulo + '" — ' +
      partes.filter(function (p) { return p; }).join(' · ');

    painelDuplicata.classList.remove('oculta');
    painelDuplicata.dataset.idTitulo = existente.id_titulo;
    painelDuplicata.scrollIntoView({ block: 'nearest' });
  }

  $('#btn-somar-exemplar').addEventListener('click', function () {
    var pacote = dadosDoFormulario();
    var id = Number(painelDuplicata.dataset.idTitulo);
    esconderDuplicata();
    dizer(estadoCadastro, 'Acrescentando exemplar…');

    google.script.run
      .withSuccessHandler(function (tombo) {
        dizer(estadoCadastro,
          'Exemplar acrescentado à obra ' + id + '. Etiquete o livro com o ' +
          'tombo ' + tombo + '.', 'ok');
        limparFormulario();
      })
      .withFailureHandler(function (erro) {
        dizer(estadoCadastro, erro.message || 'Não consegui acrescentar.', 'erro');
      })
      .acrescentarExemplar(EU.sessao, id, pacote.dados);
  });

  $('#btn-forcar').addEventListener('click', function () {
    esconderDuplicata();
    salvar(true);
  });

  /** Lê o formulário inteiro, separando o que é dado do que é controle. */
  function dadosDoFormulario() {
    var dados = {};
    Array.prototype.forEach.call(formulario.elements, function (campo) {
      if (!campo.name) return;
      dados[campo.name] = campo.type === 'checkbox' ? campo.checked : campo.value.trim();
    });

    delete dados.quem_registrou;
    delete dados.psicografada;   // controle de tela, não coluna

    return { dados: dados };
  }

  function salvar(permitirDuplicata) {
    var pacote = dadosDoFormulario();
    var botao = $('#btn-salvar');
    var dados = pacote.dados;

    botao.disabled = true;
    dizer(estadoCadastro, 'Salvando…');

    google.script.run
      .withSuccessHandler(function (resposta) {
        botao.disabled = false;
        var recado = 'Título ' + resposta.id_titulo + ' cadastrado.';
        if (resposta.tombo) {
          recado += ' Etiquete o livro com o tombo ' + resposta.tombo + '.';
        }
        dizer(estadoCadastro, recado, 'ok');
        limparFormulario();
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoCadastro, erro.message || 'Não consegui salvar.', 'erro');
      })
      .cadastrarTituloComExemplar(EU.sessao, dados, permitirDuplicata);
  }

  /**
   * Limpa a obra mas preserva quem está cadastrando, a série, o doador e a
   * editora: cataloga-se uma pilha de livros seguidos, quase sempre da mesma
   * série, da mesma doação ou da mesma editora.
   */
  function limparFormulario() {
    $('#btn-salvar').disabled = false;

    var serie = formulario.elements.serie.value;
    var doador = formulario.elements.doado_por.value;
    var editora = formulario.elements.editora.value;

    formulario.reset();
    formulario.elements.serie.value = serie;
    formulario.elements.doado_por.value = doador;
    formulario.elements.editora.value = editora;

    ajustarAutoria();
    $('#aviso-isbn').textContent = '';
    $('#aviso-titulo').textContent = '';
    $('#candidatos').innerHTML = '';
    formulario.elements.titulo.focus();
  }

  // ----------------------------------------------------------------- balcão
  // Empréstimo e devolução na mesma tela. Vai ser usada em pé, no celular,
  // com o livro numa mão: o caminho é digitar o tombo e confirmar.

  var campoTombo = $('#tombo');
  var estadoTombo = $('#estado-tombo');
  var ficha = $('#ficha');
  var pessoaEscolhida = null;
  var tomboEmVoo = 0;
  var temporizadorTombo = null;

  // Quem atende é a mesma pessoa durante um plantão inteiro. Guardar poupa
  // redigitar a cada livro — e é dado do voluntário, não do frequentador.
  campoTombo.addEventListener('input', function () {
    clearTimeout(temporizadorTombo);
    temporizadorTombo = setTimeout(carregarTombo, 350);
  });

  function carregarTombo() {
    var valor = campoTombo.value.trim();
    ficha.classList.add('oculta');
    limparEscolhaDePessoa();

    if (!valor) { dizer(estadoTombo, ''); return; }

    var esta = ++tomboEmVoo;
    dizer(estadoTombo, 'Procurando o tombo…');

    google.script.run
      .withSuccessHandler(function (dados) {
        if (esta !== tomboEmVoo) return;
        dizer(estadoTombo, '');
        mostrarFicha(dados);
      })
      .withFailureHandler(function (erro) {
        if (esta !== tomboEmVoo) return;
        dizer(estadoTombo, erro.message || 'Não consegui achar esse tombo.', 'erro');
      })
      .verExemplar(EU.sessao, valor);
  }

  function mostrarFicha(dados) {
    $('#ficha-titulo').textContent = dados.titulo;
    $('#ficha-autoria').textContent = dados.autoria;

    var meta = ['tombo ' + dados.tombo];
    if (dados.edicao) meta.push(dados.edicao);
    if (dados.estado) meta.push('estado: ' + dados.estado);
    $('#ficha-meta').textContent = meta.join(' · ');

    var selo = $('#ficha-selo');
    var emprestado = dados.situacao === 'emprestado';
    var baixado = dados.situacao === 'baixado';

    // Aqui PODE aparecer o nome de quem está com o livro: é tela de balcão,
    // não a busca pública. A distinção é a seção 6 da especificação.
    if (emprestado) {
      selo.textContent = 'com ' + dados.com_quem + ' — devolver até ' +
        dados.data_prevista +
        (dados.dias_de_atraso > 0
          ? ' (' + dados.dias_de_atraso + ' dia(s) de atraso)'
          : '');
    } else {
      selo.textContent = dados.situacao;
    }
    selo.className = 'selo ' +
      (emprestado ? 'emprestado' : baixado ? 'sem_exemplar' : 'disponivel');

    $('#acao-emprestar').classList.toggle('oculta', dados.situacao !== 'disponível');
    $('#acao-devolver').classList.toggle('oculta', !emprestado);
    ficha.classList.remove('oculta');
  }

  // --- escolher a pessoa
  var campoPessoa = $('#pessoa');
  var listaPessoas = $('#pessoas-achadas');
  var temporizadorPessoa = null;

  campoPessoa.addEventListener('input', function () {
    limparEscolhaDePessoa(true);
    clearTimeout(temporizadorPessoa);
    temporizadorPessoa = setTimeout(procurarPessoas, 300);
  });

  function procurarPessoas() {
    var termo = campoPessoa.value.trim();
    listaPessoas.innerHTML = '';
    if (termo.length < 2) return;

    google.script.run
      .withSuccessHandler(function (resposta) {
        var achadas = resposta.pessoas;
        listaPessoas.innerHTML = '';
        // Avisa quando a lista foi cortada. Numa casa com cinco "Maria", o
        // atendente precisa saber que não está vendo todas — senão empresta
        // para a Maria errada achando que era a única.
        if (resposta.sobraram) {
          $('#pessoa-escolhida').textContent =
            'Mostrando ' + achadas.length + '. Há mais ' + resposta.sobraram +
            ' com esse nome — escreva mais letras.';
        }
        if (!achadas.length) {
          $('#pessoa-escolhida').textContent =
            'Ninguém com esse nome. Cadastre em Cadastrar → Pessoa.';
          return;
        }
        achadas.forEach(function (pessoa) {
          var item = document.createElement('li');
          var botao = document.createElement('button');
          botao.type = 'button';
          botao.className = 'candidato';
          botao.textContent = pessoa.nome;
          botao.addEventListener('click', function () {
            pessoaEscolhida = pessoa;
            campoPessoa.value = pessoa.nome;
            listaPessoas.innerHTML = '';
            $('#pessoa-escolhida').textContent = 'Vai levar: ' + pessoa.nome;
            $('#btn-emprestar').disabled = false;
          });
          item.appendChild(botao);
          listaPessoas.appendChild(item);
        });
      })
      .withFailureHandler(function (erro) {
        $('#pessoa-escolhida').textContent = erro.message || 'Não consegui buscar.';
      })
      .buscarPessoas(EU.sessao, termo);
  }

  function limparEscolhaDePessoa(manterTexto) {
    pessoaEscolhida = null;
    $('#btn-emprestar').disabled = true;
    $('#pessoa-escolhida').textContent = '';
    listaPessoas.innerHTML = '';
    if (!manterTexto) campoPessoa.value = '';
  }

  // --- as três ações do balcão
  $('#btn-emprestar').addEventListener('click', function () {
    if (!pessoaEscolhida || !exigirAtendente()) return;
    acaoDeBalcao(this, 'Emprestando…', function (run) {
      return run.registrarEmprestimo(EU.sessao, campoTombo.value.trim(),
        pessoaEscolhida.id_pessoa, '');
    }, function (r) {
      return 'Emprestado a ' + r.nome + '. Devolver até ' + r.data_prevista + '.';
    });
  });

  $('#btn-devolver').addEventListener('click', function () {
    if (!exigirAtendente()) return;
    acaoDeBalcao(this, 'Registrando devolução…', function (run) {
      return run.registrarDevolucao(EU.sessao, campoTombo.value.trim());
    }, function (r) {
      return r.dias_de_atraso > 0
        ? 'Devolvido com ' + r.dias_de_atraso + ' dia(s) de atraso.'
        : 'Devolvido em dia.';
    });
  });

  $('#btn-renovar').addEventListener('click', function () {
    if (!exigirAtendente()) return;
    acaoDeBalcao(this, 'Renovando…', function (run) {
      return run.renovar(EU.sessao, campoTombo.value.trim());
    }, function (r) {
      return 'Renovado até ' + r.data_prevista + ' (renovação ' + r.renovacoes + ').';
    });
  });

  /** A identidade agora vem da sessão, não de quem digita o próprio nome. */
  function exigirAtendente() {
    if (EU.sessao) return true;
    dizer(estadoTombo, 'Entre no sistema para registrar movimentação.', 'erro');
    irPara('entrada');
    return false;
  }

  /**
   * As três ações têm a mesma coreografia: desabilita o botão, chama, mostra o
   * recado e limpa para o próximo livro. Repetir isso em três lugares é como
   * um botão acaba travado depois de uma falha.
   */
  function acaoDeBalcao(botao, aguardando, chamar, recado) {
    botao.disabled = true;
    dizer(estadoTombo, aguardando);

    chamar(google.script.run
      .withSuccessHandler(function (resposta) {
        botao.disabled = false;
        dizer(estadoTombo, recado(resposta), 'ok');
        ficha.classList.add('oculta');
        campoTombo.value = '';
        limparEscolhaDePessoa();
        campoTombo.focus();
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoTombo, erro.message || 'Não consegui completar.', 'erro');
      }));
  }

  // ---------------------------------------------------------------- atrasos
  var listaEmprestados = $('#lista-emprestados');
  var estadoAtrasos = $('#estado-atrasos');

  $('#btn-atrasados').addEventListener('click', function () { listar(true); });
  $('#btn-todos').addEventListener('click', function () { listar(false); });

  function listar(somenteAtrasados) {
    listaEmprestados.innerHTML = '';
    dizer(estadoAtrasos, 'Carregando…');

    google.script.run
      .withSuccessHandler(function (linhas) {
        if (!linhas.length) {
          dizer(estadoAtrasos, somenteAtrasados
            ? 'Nenhum livro atrasado.'
            : 'Nenhum livro emprestado no momento.');
          return;
        }
        dizer(estadoAtrasos, linhas.length + ' livro(s)');
        linhas.forEach(function (linha) {
          listaEmprestados.appendChild(itemEmprestado(linha));
        });
      })
      .withFailureHandler(function (erro) {
        dizer(estadoAtrasos, erro.message || 'Não consegui carregar.', 'erro');
      })
      .listarEmprestados(EU.sessao, somenteAtrasados);
  }

  function itemEmprestado(linha) {
    var item = document.createElement('li');
    item.className = 'resultado' + (linha.dias_de_atraso > 0 ? ' atrasado' : '');

    item.appendChild(elemento('h2', linha.titulo));
    if (linha.autoria) item.appendChild(elemento('p', linha.autoria, 'autoria'));
    item.appendChild(elemento('p',
      'tombo ' + linha.tombo + ' · com ' + linha.nome, 'meta'));

    var prazo = elemento('p', '', 'meta');
    if (linha.dias_de_atraso > 0) {
      prazo.appendChild(elemento('span',
        linha.dias_de_atraso + ' dia(s) de atraso', 'dias-atraso'));
      prazo.appendChild(document.createTextNode(' — venceu em ' + linha.data_prevista));
    } else {
      prazo.textContent = 'devolver até ' + linha.data_prevista;
    }
    if (Number(linha.renovacoes) > 0) {
      prazo.appendChild(document.createTextNode(
        ' · ' + linha.renovacoes + ' renovação(ões)'));
    }
    item.appendChild(prazo);

    return item;
  }

  // --------------------------------------------------- cadastro: abas internas
  document.querySelectorAll('.aba-interna').forEach(function (aba) {
    aba.addEventListener('click', function () {
      document.querySelectorAll('.aba-interna').forEach(function (outra) {
        outra.classList.toggle('ativa', outra === aba);
      });
      $('#form-cadastro').classList.toggle('oculta', aba.dataset.bloco !== 'obra');
      $('#form-pessoa').classList.toggle('oculta', aba.dataset.bloco !== 'pessoa');
      $('#form-editar-pessoa').classList.toggle('oculta', aba.dataset.bloco !== 'editar');
    });
  });

  // --------------------------------------------------------- cadastro: pessoa
  var formPessoa = $('#form-pessoa');
  var estadoPessoa = $('#estado-pessoa');

  formPessoa.addEventListener('submit', function (evento) {
    evento.preventDefault();
    var botao = $('#btn-salvar-pessoa');

    var dados = {};
    Array.prototype.forEach.call(formPessoa.elements, function (campo) {
      if (!campo.name) return;
      dados[campo.name] = campo.type === 'checkbox' ? campo.checked : campo.value.trim();
    });
    delete dados.quem_registrou;

    botao.disabled = true;
    dizer(estadoPessoa, 'Salvando…');

    google.script.run
      .withSuccessHandler(function (id) {
        botao.disabled = false;
        dizer(estadoPessoa, dados.nome + ' cadastrado (nº ' + id + ').', 'ok');
        formPessoa.reset();
        formPessoa.elements.nome.focus();
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoPessoa, erro.message || 'Não consegui salvar.', 'erro');
      })
      .criarPessoa(EU.sessao, dados);
  });

  // -------------------------------------------------- cadastro: alterar pessoa
  var formEditar = $('#form-editar-pessoa');
  var estadoEditar = $('#estado-editar');
  var camposEditar = $('#campos-editar');
  var buscaEditar = $('#busca-editar');
  var listaEditar = $('#pessoas-editar');
  var pessoaEmEdicao = null;
  var temporizadorEditar = null;

  buscaEditar.addEventListener('input', function () {
    clearTimeout(temporizadorEditar);
    temporizadorEditar = setTimeout(procurarParaEditar, 300);
  });

  function procurarParaEditar() {
    var termo = buscaEditar.value.trim();
    listaEditar.innerHTML = '';
    if (termo.length < 2) return;

    google.script.run
      .withSuccessHandler(function (achadas) {
        listaEditar.innerHTML = '';
        if (!achadas.length) {
          dizer(estadoEditar, 'Ninguém com esse nome.');
          return;
        }
        dizer(estadoEditar, '');
        achadas.forEach(function (pessoa) {
          var item = document.createElement('li');
          var botao = document.createElement('button');
          botao.type = 'button';
          botao.className = 'candidato';
          // Inativo aparece marcado: é justamente quem alguém vem reativar.
          botao.textContent = pessoa.nome + (pessoa.ativo ? '' : '  (inativo)');
          botao.addEventListener('click', function () { carregarPessoa(pessoa.id_pessoa); });
          item.appendChild(botao);
          listaEditar.appendChild(item);
        });
      })
      .withFailureHandler(function (erro) {
        dizer(estadoEditar, erro.message || 'Não consegui buscar.', 'erro');
      })
      .buscarPessoasParaEditar(EU.sessao, termo);
  }

  function carregarPessoa(idPessoa) {
    dizer(estadoEditar, 'Carregando…');

    google.script.run
      .withSuccessHandler(function (pessoa) {
        pessoaEmEdicao = pessoa;
        listaEditar.innerHTML = '';
        buscaEditar.value = '';
        dizer(estadoEditar, '');

        $('#editando-quem').textContent =
          'Alterando: ' + pessoa.nome + ' (nº ' + pessoa.id_pessoa + ')';

        formEditar.elements.nome.value = pessoa.nome;
        formEditar.elements.telefone.value = '';
        formEditar.elements.email.value = '';
        formEditar.elements.limpar_telefone.checked = false;
        formEditar.elements.limpar_email.checked = false;
        formEditar.elements.frequentador.checked = pessoa.frequentador;
        formEditar.elements.palestrante.checked = pessoa.palestrante;
        formEditar.elements.ativo.checked = pessoa.ativo;
        formEditar.elements.observacao.value = pessoa.observacao || '';

        // Só diz SE existe, nunca o valor.
        $('#tem-telefone').textContent = pessoa.tem_telefone
          ? '(há um gravado)' : '(vazio)';
        $('#tem-email').textContent = pessoa.tem_email
          ? '(há um gravado)' : '(vazio)';

        camposEditar.classList.remove('oculta');
        formEditar.elements.nome.focus();
      })
      .withFailureHandler(function (erro) {
        dizer(estadoEditar, erro.message || 'Não consegui carregar.', 'erro');
      })
      .verPessoa(EU.sessao, idPessoa);
  }

  formEditar.addEventListener('submit', function (evento) {
    evento.preventDefault();
    if (!pessoaEmEdicao) return;

    var botao = $('#btn-salvar-edicao');
    var mudancas = {
      nome: formEditar.elements.nome.value.trim(),
      telefone: formEditar.elements.telefone.value.trim(),
      email: formEditar.elements.email.value.trim(),
      limpar_telefone: formEditar.elements.limpar_telefone.checked,
      limpar_email: formEditar.elements.limpar_email.checked,
      frequentador: formEditar.elements.frequentador.checked,
      palestrante: formEditar.elements.palestrante.checked,
      ativo: formEditar.elements.ativo.checked,
      observacao: formEditar.elements.observacao.value.trim()
    };

    botao.disabled = true;
    dizer(estadoEditar, 'Salvando…');

    google.script.run
      .withSuccessHandler(function () {
        botao.disabled = false;
        dizer(estadoEditar, mudancas.nome + ' atualizado.', 'ok');
        camposEditar.classList.add('oculta');
        pessoaEmEdicao = null;
        buscaEditar.focus();
      })
      .withFailureHandler(function (erro) {
        botao.disabled = false;
        dizer(estadoEditar, erro.message || 'Não consegui salvar.', 'erro');
      })
      .atualizarPessoa(EU.sessao, pessoaEmEdicao.id_pessoa, mudancas);
  });

  // ----------------------------------------------------------------- agenda
  var listaReunioes = $('#lista-reunioes');
  var estadoAgenda = $('#estado-agenda');
  var agendaCarregada = false;

  // Só carrega quando a aba é aberta: a maioria de quem entra vem buscar
  // livro, e uma chamada ao servidor a cada visita custa quota à toa.
  document.querySelectorAll('.aba').forEach(function (aba) {
    aba.addEventListener('click', function () {
      if (aba.dataset.visao === 'agenda' && !agendaCarregada) carregarAgenda();
    });
  });

  function carregarAgenda() {
    agendaCarregada = true;
    listaReunioes.innerHTML = '';
    dizer(estadoAgenda, 'Carregando…');

    google.script.run
      .withSuccessHandler(function (reunioes) {
        if (!reunioes.length) {
          dizer(estadoAgenda,
            'Nenhuma reunião marcada. Se a página de agendamento já existe, ' +
            'a sincronização roda de madrugada.');
          return;
        }
        dizer(estadoAgenda, reunioes.length + ' reunião(ões) marcada(s)');
        reunioes.forEach(function (reuniao) {
          listaReunioes.appendChild(itemReuniao(reuniao));
        });
      })
      .withFailureHandler(function (erro) {
        agendaCarregada = false;   // deixa tentar de novo
        dizer(estadoAgenda, erro.message || 'Não consegui carregar.', 'erro');
      })
      .listarProximasReunioes(12);
  }

  function itemReuniao(reuniao) {
    var item = document.createElement('li');
    item.className = 'resultado';

    item.appendChild(elemento('h2',
      reuniao.data + (reuniao.horario ? ' às ' + reuniao.horario : '')));

    item.appendChild(elemento('p',
      reuniao.palestrante || 'sem palestrante inscrito', 'autoria'));

    if (reuniao.tema) {
      item.appendChild(elemento('p', reuniao.tema, 'meta'));
    }

    // Campo de tema aparece só onde falta: reunião com tema definido vira
    // leitura, e a tela não fica um formulário gigante.
    if (!reuniao.tema) {
      var linha = document.createElement('div');
      linha.className = 'linha-isbn';

      var campo = document.createElement('input');
      campo.placeholder = 'tema desta reunião';
      campo.className = 'cresce';

      var botao = document.createElement('button');
      botao.type = 'button';
      botao.textContent = 'Gravar tema';
      botao.addEventListener('click', function () {
        var texto = campo.value.trim();
        if (!texto) { campo.focus(); return; }

        if (!EU.sessao) {
          dizer(estadoAgenda, 'Entre no sistema para gravar o tema.', 'erro');
          irPara('entrada');
          return;
        }

        botao.disabled = true;
        google.script.run
          .withSuccessHandler(function () {
            dizer(estadoAgenda, 'Tema gravado.', 'ok');
            agendaCarregada = false;
            carregarAgenda();
          })
          .withFailureHandler(function (erro) {
            botao.disabled = false;
            dizer(estadoAgenda, erro.message || 'Não consegui gravar.', 'erro');
          })
          .definirTema(EU.sessao, reuniao.id_reuniao, texto);
      });

      linha.appendChild(campo);
      linha.appendChild(botao);
      item.appendChild(linha);
    }

    return item;
  }

  // ------------------------------------------------------------ meus livros
  // Sem sessão, por decisão: parte dos frequentadores não tem e-mail. O
  // servidor devolve só livro e prazo, e responde igual para contato que não
  // existe — a tela não pode virar forma de descobrir quem frequenta a casa.

  var listaMeus = $('#lista-meus');
  var estadoMeus = $('#estado-meus');

  $('#form-meus').addEventListener('submit', function (evento) {
    evento.preventDefault();
    var contato = $('#contato').value.trim();

    listaMeus.innerHTML = '';
    if (!contato) { dizer(estadoMeus, ''); return; }
    dizer(estadoMeus, 'Procurando…');

    google.script.run
      .withSuccessHandler(function (resposta) {
        listaMeus.innerHTML = '';
        if (!resposta.emprestimos.length) {
          dizer(estadoMeus, resposta.recado);
          return;
        }
        dizer(estadoMeus, resposta.emprestimos.length === 1
          ? '1 livro com você'
          : resposta.emprestimos.length + ' livros com você');

        resposta.emprestimos.forEach(function (livro) {
          var item = document.createElement('li');
          item.className = 'resultado' + (livro.dias_de_atraso > 0 ? ' atrasado' : '');

          item.appendChild(elemento('h2', livro.titulo));
          if (livro.autoria) item.appendChild(elemento('p', livro.autoria, 'autoria'));

          var prazo = elemento('p', '', 'meta');
          if (livro.dias_de_atraso > 0) {
            prazo.appendChild(elemento('span',
              livro.dias_de_atraso + ' dia(s) de atraso', 'dias-atraso'));
            prazo.appendChild(document.createTextNode(
              ' — devolver em ' + livro.data_prevista));
          } else {
            prazo.textContent = 'devolver até ' + livro.data_prevista;
          }
          item.appendChild(prazo);

          listaMeus.appendChild(item);
        });
      })
      .withFailureHandler(function (erro) {
        dizer(estadoMeus, erro.message || 'Não consegui consultar.', 'erro');
      })
      .meusEmprestimos(contato);
  });


  // ------------------------------------------------------------ manual
  // Um assunto por vez. Quem consulta o manual está com um problema na mão, em
  // pé no balcão, e quer a resposta daquele problema — não a lista dos treze.
  //
  // O índice e o botão de voltar são governados por JS. Sem ele, tudo fica
  // visível e o manual volta a ser a página longa com âncoras: menos
  // confortável, mas inteiramente legível. Nada aqui é indispensável para ler.

  var indiceManual = $('.manual-indice');
  var voltarManual = $('#voltar-manual');
  // Abertura e rodapé pertencem ao índice: somem quando um assunto abre.
  var soNoIndice = document.querySelectorAll('.so-no-indice');
  var verbetes = Array.prototype.slice.call(document.querySelectorAll('.verbete'));

  function mostrarIndiceDoManual() {
    verbetes.forEach(function (verbete) { verbete.classList.add('oculta'); });
    indiceManual.classList.remove('oculta');
    soNoIndice.forEach(function (parte) { parte.classList.remove('oculta'); });
    voltarManual.classList.add('oculta');
  }

  function abrirVerbete(id) {
    verbetes.forEach(function (verbete) {
      verbete.classList.toggle('oculta', verbete.id !== id);
    });
    indiceManual.classList.add('oculta');
    soNoIndice.forEach(function (parte) { parte.classList.add('oculta'); });
    voltarManual.classList.remove('oculta');

    // O assunto escolhido tem que começar onde os olhos já estão, e não onde a
    // rolagem do índice parou.
    window.scrollTo(0, 0);

    // Leva o foco ao título: quem usa teclado ou leitor de tela precisa saber
    // que a tela trocou, e não só que algo sumiu.
    var titulo = document.querySelector('#' + id + ' h2');
    if (titulo) titulo.focus();
  }

  indiceManual.querySelectorAll('a').forEach(function (link) {
    link.addEventListener('click', function (evento) {
      evento.preventDefault();
      abrirVerbete(link.getAttribute('href').slice(1));
    });
  });

  voltarManual.addEventListener('click', mostrarIndiceDoManual);

  // Sair da aba Manual e voltar depois reabre no índice, não no assunto que
  // alguém leu semana passada.
  document.querySelectorAll('.aba').forEach(function (aba) {
    aba.addEventListener('click', function () {
      if (aba.dataset.visao === 'manual') mostrarIndiceDoManual();
    });
  });

  mostrarIndiceDoManual();

  // ------------------------------------------------------------- auxiliares
  /**
   * Diz o que conferir na autoria. O Google marca o autor espiritual com
   * "(Espírito)" e o sistema separa sozinho — mas quando a marca não vem, o
   * médium acaba no campo Autor, e aí alguém precisa mover.
   */
  function recadoDeAutoria(livro) {
    // A consulta preencheu autor_espiritual? Então é psicografia, e a caixa
    // tem que refletir isso — senão o rótulo diria "Autor" sobre um médium.
    caixaPsicografada.checked = !!livro.autor_espiritual;
    ajustarAutoria();
    formulario.elements.autor_espiritual.value = livro.autor_espiritual || '';

    if (livro.autor_espiritual) {
      return 'Psicografia reconhecida: autor espiritual e médium foram ' +
        'separados. Confira, e escolha a categoria.';
    }
    return 'Confira a autoria — se esta obra for psicografada, o Google não ' +
      'marcou, e o nome no campo Autor precisa ir para Médium.';
  }

  function elemento(marca, texto, classe) {
    var no = document.createElement(marca);
    no.textContent = texto;          // textContent, nunca innerHTML: o acervo
    if (classe) no.className = classe;  // é digitado por gente e pode ter < e &
    return no;
  }

  function preencherSelect(select, valores, padrao) {
    select.innerHTML = '';
    valores.forEach(function (valor) {
      var opcao = document.createElement('option');
      opcao.value = valor;
      opcao.textContent = valor;
      if (valor === padrao) opcao.selected = true;
      select.appendChild(opcao);
    });
  }

  function dizer(onde, texto, classe) {
    onde.textContent = texto;
    onde.className = 'estado' + (classe ? ' ' + classe : '');
  }

  // Última coisa: a sessão guardada pode ter vencido com a aba fechada, e é
  // isto que decide quais abas aparecem.
  conferirSessao();
})();
</script>
