<!-- ui/css.html — estilos base. Mobile primeiro: a tela de empréstimo vai ser
     usada em pé, no celular. -->
<style>
  :root {
    --tinta: #202124;
    --tinta-fraca: #5f6368;
    --fundo: #ffffff;
    --borda: #dadce0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1rem;
    background: var(--fundo);
    color: var(--tinta);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .cartao {
    max-width: 34rem;
    margin: 2rem auto;
    padding: 1.5rem;
    border: 1px solid var(--borda);
    border-radius: 8px;
  }
  h1 { margin-top: 0; font-size: 1.5rem; }
  .nota { color: var(--tinta-fraca); font-size: 0.875rem; }
</style>
