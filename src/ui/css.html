<!-- ui/css.html — estilos.

     Celular primeiro: a tela de empréstimo da Fase 2 vai ser usada em pé, no
     corredor, e a de busca por quem está com o livro na mão. Alvo de toque de
     44px e fonte de 16px nos campos — abaixo disso o iOS dá zoom sozinho ao
     focar, e a pessoa perde o contexto da tela. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bitter:wght@600;700&display=swap">

<style>
  /* Identidade da Casa Espírita Francisco de Assis — Pitangui/MG.
     O azul e o marrom vêm da logomarca: o arco e a figura de Francisco.

     As cores de ESTADO (disponível, emprestado, atrasado) são outra coisa e
     não seguem a marca: elas significam, e trocá-las por tons da logo faria
     um livro atrasado parecer decoração. */
  :root {
    --tinta: #1f2328;
    --tinta-fraca: #5b6570;
    --fundo: #ffffff;
    --fundo-suave: #f4f7fa;
    --borda: #d3dde6;

    --acento: #2f6699;      /* azul da logo, escurecido para texto legível */
    --acento-claro: #4a86c5;
    --acento-suave: #e7f0f8;
    --marrom: #8a5a34;      /* o hábito de Francisco */
    --marrom-suave: #f5ede4;

    --disponivel: #1a7f4b;
    --emprestado: #a35200;
    --ausente: #6b7580;
    --erro: #b3261e;

    --aviso-borda: #a8860a;
    --aviso-fundo: #fdf6e0;
    --sobre-acento: #ffffff;   /* texto sobre o azul cheio */
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --tinta: #e6ebf0;
      --tinta-fraca: #9aa7b4;
      --fundo: #14181c;
      --fundo-suave: #1c2229;
      --borda: #2c353e;

      --acento: #7fb3e0;
      --acento-claro: #4a86c5;
      --acento-suave: #1b2a38;
      --marrom: #c99a70;
      --marrom-suave: #2a2019;

      --aviso-borda: #a8860a;
      --aviso-fundo: #2b2510;

      --disponivel: #6ec99a;
      --emprestado: #e0a765;
      --ausente: #99a3ad;
      --erro: #f0938c;
      --sobre-acento: #10171d;
    }
  }

  * { box-sizing: border-box; }

  /* 17px e entrelinha larga: o acervo é operado por gente de todas as idades,
     em pé, no corredor. Atkinson Hyperlegible foi desenhada para baixa visão e
     distingue 0 de O e 1 de l — num sistema em que tudo é número de tombo,
     isso deixa de ser detalhe. */
  body {
    margin: 0;
    padding: 0 1rem 3rem;
    background: var(--fundo);
    color: var(--tinta);
    font: 17px/1.6 "Atkinson Hyperlegible", system-ui, -apple-system,
          "Segoe UI", Roboto, sans-serif;
  }

  h1, h2, legend {
    font-family: Bitter, Georgia, "Times New Roman", serif;
    text-wrap: balance;
  }

  /* Número de tombo, prazo, contagem: alinhados em coluna. */
  .meta, .selo, kbd { font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }

  main, .topo { max-width: 46rem; margin: 0 auto; }

  /* --- topo --- */
  .topo { padding-top: 1.25rem; }
  .topo h1 { margin: 0 0 .75rem; font-size: 1.35rem; }

  /* Sete abas não cabem em 360px. Rolagem lateral é o padrão que as pessoas
     já conhecem, e é melhor que quebrar em duas linhas ou espremer o texto
     até virar ilegível. */
  .abas {
    display: flex;
    gap: .25rem;
    border-bottom: 1px solid var(--borda);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .abas::-webkit-scrollbar { display: none; }
  .aba { flex: none; white-space: nowrap; }
  .aba {
    appearance: none;
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    padding: .6rem .9rem;
    min-height: 44px;
    font: inherit;
    color: var(--tinta-fraca);
    cursor: pointer;
  }
  .aba:hover { color: var(--tinta); }
  .aba.ativa { color: var(--acento); border-bottom-color: var(--acento); font-weight: 600; }

  .visao { padding-top: 1.25rem; }
  .oculta { display: none; }

  /* --- busca --- */
  .linha-busca { display: flex; gap: .5rem; }
  .linha-busca input { flex: 1; }

  .dica { color: var(--tinta-fraca); font-size: .85rem; margin: .4rem 0 0; }

  .resultados { list-style: none; padding: 0; margin: 1rem 0 0; }
  .resultado {
    padding: .9rem 0;
    border-bottom: 1px solid var(--borda);
  }
  .resultado h2 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  .resultado .autoria { margin: .15rem 0 0; }
  .resultado .meta { margin: .15rem 0 0; color: var(--tinta-fraca); font-size: .85rem; }

  .selo {
    display: inline-block;
    margin-top: .45rem;
    padding: .15rem .5rem;
    border-radius: 999px;
    font-size: .8rem;
    font-weight: 600;
    background: var(--fundo-suave);
  }
  .selo.disponivel   { color: var(--disponivel); }
  .selo.emprestado   { color: var(--emprestado); }
  .selo.sem_exemplar { color: var(--ausente); }

  .estado { margin-top: .9rem; color: var(--tinta-fraca); }
  .estado.erro { color: var(--erro); }
  .estado.ok { color: var(--disponivel); }

  /* --- formulário --- */
  fieldset {
    border: 1px solid var(--borda);
    border-radius: 8px;
    padding: .9rem 1rem 1.1rem;
    margin: 0 0 1rem;
  }
  legend { padding: 0 .35rem; font-weight: 600; font-size: .9rem; }

  label { display: block; margin-top: .8rem; font-size: .85rem; color: var(--tinta-fraca); }
  label.caixa { display: flex; align-items: center; gap: .5rem; color: var(--tinta); font-size: 1rem; }
  label.cresce { flex: 1; }

  input, select, textarea {
    display: block;
    width: 100%;
    margin-top: .2rem;
    padding: .55rem .6rem;
    min-height: 44px;
    border: 1px solid var(--borda);
    border-radius: 6px;
    font: inherit;          /* 16px: abaixo disso o iOS dá zoom ao focar */
    color: var(--tinta);
    background: var(--fundo);
  }
  input[type="checkbox"] { width: auto; min-height: 0; margin: 0; }
  textarea { min-height: 0; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible,
  a:focus-visible, .aba:focus-visible {
    outline: 3px solid var(--acento);
    outline-offset: 2px;
  }

  .par { display: flex; gap: .75rem; }
  .par > label { flex: 1; }
  .linha-isbn { display: flex; gap: .5rem; align-items: flex-end; }

  .obrigatorio { color: var(--erro); }

  /* Candidatos da busca por título. Precisam mostrar editora e ano: é o que
     distingue uma edição da outra, e escolher a errada erra a ficha. */
  .candidatos { list-style: none; padding: 0; margin: .6rem 0 0; }
  .candidatos:empty { margin: 0; }
  .candidatos li { margin-bottom: .4rem; }
  .candidato {
    display: block;
    width: 100%;
    text-align: left;
    padding: .55rem .7rem;
    background: var(--fundo-suave);
    color: var(--tinta);
    border: 1px solid var(--borda);
    font-weight: 400;
    line-height: 1.35;
  }
  .candidato strong { display: block; font-weight: 600; }
  .candidato small { color: var(--tinta-fraca); }

  button {
    padding: .6rem 1.1rem;
    min-height: 44px;
    border: 1px solid var(--acento);
    border-radius: 6px;
    background: var(--acento);
    color: var(--sobre-acento);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button[type="button"] { background: var(--fundo); color: var(--acento); }
  button:disabled { opacity: .55; cursor: progress; }

  #btn-salvar { width: 100%; }

  /* Duplicata é escolha, não erro: amarelo de atenção, não vermelho de falha,
     e a opção mais provável vem primeiro e destacada. */
  .aviso {
    border: 1px solid var(--aviso-borda);
    border-left: 4px solid var(--aviso-borda);
    border-radius: 6px;
    background: var(--aviso-fundo);
    color: var(--tinta);
    padding: .8rem 1rem;
    margin-bottom: 1rem;
  }
  .aviso p { margin: 0 0 .5rem; }
  .escolhas { display: flex; flex-direction: column; gap: .5rem; }
  .escolhas button { width: 100%; }
  /* Abas de segundo nível, dentro do Cadastrar. Menores que as do topo, para
     a hierarquia ficar óbvia sem precisar de explicação. */
  .abas-internas { display: flex; gap: .25rem; margin-bottom: 1rem; }
  .aba-interna {
    background: var(--fundo-suave);
    color: var(--tinta-fraca);
    border: 1px solid var(--borda);
    font-weight: 400;
    padding: .4rem .9rem;
  }
  .aba-interna.ativa {
    background: var(--acento);
    color: var(--sobre-acento);
    border-color: var(--acento);
    font-weight: 600;
  }

  /* Ficha do exemplar no balcão. Grande e legível: é lida em pé, de relance. */
  .ficha {
    border: 1px solid var(--borda);
    border-radius: 8px;
    padding: 1rem;
    margin-top: 1rem;
  }
  .ficha h2 { margin: 0 0 .1rem; font-size: 1.15rem; }
  .ficha .selo { font-size: .95rem; }

  .escolhas-linha { display: flex; gap: .5rem; flex-wrap: wrap; }

  /* Linha de empréstimo na lista de atrasos. */
  .atrasado { border-left: 4px solid var(--emprestado); padding-left: .7rem; }
  .dias-atraso { color: var(--emprestado); font-weight: 600; }

  /* Barra de identidade: discreta, mas sempre visivel — quem esta de plantao
     precisa saber com que conta esta gravando. */
  .identidade {
    display: flex;
    align-items: center;
    gap: .5rem;
    flex: none;
    font-size: .85rem;
    color: var(--tinta-fraca);
  }
  .identidade button { padding: .35rem .8rem; min-height: 38px; font-size: .85rem; }

  /* O nome corta com reticências antes de empurrar o botão para fora. */
  #quem-sou {
    max-width: 11rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #meu-nome { color: var(--tinta); }

  .cartao-entrada {
    max-width: 24rem;
    border: 1px solid var(--borda);
    border-radius: 8px;
    padding: 1.2rem;
  }
  .cartao-entrada h2 { margin: 0 0 .3rem; font-size: 1.1rem; }
  .cartao-entrada button { width: 100%; margin-top: .9rem; }

  button.discreto {
    background: var(--fundo);
    color: var(--tinta-fraca);
    border-color: var(--borda);
    font-weight: 400;
  }

  /* --- marca da casa ---
     O símbolo tem fundo transparente, então funciona nos dois temas sem
     tratamento. O nome vem do Config e fica ao lado, e não dentro da imagem:
     assim ele é texto de verdade — selecionável, lido por leitor de tela e
     legível em qualquer tamanho de fonte. */
  .cabeca {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: .8rem;
  }
  .marca { display: flex; align-items: center; gap: .75rem; min-width: 0; }
  .marca h1 {
    margin: 0;
    font-size: 1.3rem;
    line-height: 1.2;
    color: var(--acento);
  }
  .logo { width: 48px; height: 48px; object-fit: contain; flex: none; }

  @media (max-width: 30rem) {
    .marca h1 { font-size: 1.05rem; }
    .logo { width: 40px; height: 40px; }
    /* O perfil sai; o nome fica. Saber COM QUEM se grava é o que importa. */
    #meu-perfil { display: none; }
    #quem-sou { max-width: 6.5rem; }
  }

  /* --- manual ---
     Coluna mais estreita que o resto do sistema: as outras telas são listas e
     formulários, esta é texto corrido, e linha longa demais cansa a leitura. */
  #visao-manual { max-width: 36rem; }
  .manual-abertura { font-size: 1rem; margin-bottom: 1.5rem; }

  .manual-indice { display: flex; flex-direction: column; }
  .manual-indice a {
    padding: .7rem .2rem;
    border-bottom: 1px solid var(--borda);
    color: var(--tinta);
    text-decoration: none;
  }
  .manual-indice a:hover { color: var(--acento); }
  .manual-indice span {
    display: block;
    color: var(--marrom);
    font-size: .74rem;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
  }

  .verbete { padding-top: 2.75rem; scroll-margin-top: 1rem; }
  .verbete h2 { margin: .25rem 0 .75rem; font-size: 1.3rem; }

  /* Diz ONDE se faz a coisa. É informação: metade da dúvida do voluntário é
     "isso é no sistema ou na planilha?". */
  .onde-fica {
    display: inline-block;
    margin: 0;
    padding: .18rem .5rem;
    border: 1px solid var(--borda);
    border-radius: 3px;
    background: var(--marrom-suave);
    color: var(--marrom);
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
  }

  ol.passos { margin: 1rem 0 0; padding-left: 0; list-style: none; counter-reset: passo; }
  ol.passos > li {
    counter-increment: passo;
    position: relative;
    padding-left: 2.4rem;
    margin-bottom: .8rem;
  }
  ol.passos > li::before {
    content: counter(passo);
    position: absolute;
    left: 0;
    top: .05rem;
    width: 1.7rem;
    height: 1.7rem;
    border-radius: 50%;
    background: var(--acento);
    color: var(--sobre-acento);
    font-size: .9rem;
    font-weight: 700;
    line-height: 1.7rem;
    text-align: center;
  }

  kbd {
    padding: .1rem .38rem;
    border: 1px solid var(--borda);
    border-bottom-width: 2px;
    border-radius: 3px;
    background: var(--fundo-suave);
    color: var(--tinta);
    font-family: inherit;
    font-size: .92em;
    font-weight: 700;
    white-space: nowrap;
  }

  /* O que o voluntário encontra quando não corre bem. */
  .e-se { margin-top: 1.3rem; }
  .e-se dt { margin-top: .9rem; font-weight: 700; }
  .e-se dt::before { content: "→ "; color: var(--acento); }
  .e-se dd { margin: .15rem 0 0; color: var(--tinta-fraca); }

  .cuidado, .proibido {
    margin-top: 1.4rem;
    padding: .9rem 1.05rem;
    border-radius: 6px;
    color: var(--tinta);
  }
  .cuidado { background: var(--aviso-fundo); border-top: 3px solid var(--aviso-borda); }
  .proibido { background: var(--fundo-suave); border-top: 3px solid var(--erro); }
  .cuidado p, .proibido p { margin: 0; }
  .cuidado p + p, .proibido p + p { margin-top: .55rem; }
  .proibido strong { color: var(--erro); }

  .palavras { margin-top: 1.2rem; }
  .palavras dt { margin-top: 1rem; font-family: Bitter, Georgia, serif; font-weight: 700; }
  .palavras dd { margin: .1rem 0 0; color: var(--tinta-fraca); }

  .manual-fim {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--borda);
    color: var(--tinta-fraca);
    font-size: .92rem;
  }

  /* Telas estreitas: dois campos lado a lado viram ilegíveis. */
  @media (max-width: 30rem) {
    .par, .linha-isbn { flex-direction: column; gap: 0; }
    .linha-isbn button { margin-top: .8rem; }
  }
</style>
