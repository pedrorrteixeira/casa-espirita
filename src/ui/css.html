<!-- ui/css.html — estilos.

     Celular primeiro: a tela de empréstimo da Fase 2 vai ser usada em pé, no
     corredor, e a de busca por quem está com o livro na mão. Alvo de toque de
     44px e fonte de 16px nos campos — abaixo disso o iOS dá zoom sozinho ao
     focar, e a pessoa perde o contexto da tela. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bitter:wght@600;700&display=swap">

<style>
  /* Identidade da Casa Espírita Francisco de Assis — Pitangui/MG.
     O azul e o marrom vêm da logomarca: o arco e a figura de Francisco.

     As cores de ESTADO (disponível, emprestado, atrasado) são outra coisa e
     não seguem a marca: elas significam, e trocá-las por tons da logo faria
     um livro atrasado parecer decoração. */
  :root {
    --tinta: #1f2328;
    --tinta-fraca: #5b6570;
    --fundo: #ffffff;
    --fundo-suave: #f4f7fa;
    --borda: #d3dde6;

    --acento: #2f6699;      /* azul da logo, escurecido para texto legível */
    --acento-claro: #4a86c5;
    --acento-suave: #e7f0f8;
    --marrom: #8a5a34;      /* o hábito de Francisco */
    --marrom-suave: #f5ede4;

    --disponivel: #1a7f4b;
    --emprestado: #a35200;
    --ausente: #6b7580;
    --erro: #b3261e;

    --aviso-borda: #a8860a;
    --aviso-fundo: #fdf6e0;
    --sobre-acento: #ffffff;   /* texto sobre o azul cheio */
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --tinta: #e6ebf0;
      --tinta-fraca: #9aa7b4;
      --fundo: #14181c;
      --fundo-suave: #1c2229;
      --borda: #2c353e;

      --acento: #7fb3e0;
      --acento-claro: #4a86c5;
      --acento-suave: #1b2a38;
      --marrom: #c99a70;
      --marrom-suave: #2a2019;

      --aviso-borda: #a8860a;
      --aviso-fundo: #2b2510;

      --disponivel: #6ec99a;
      --emprestado: #e0a765;
      --ausente: #99a3ad;
      --erro: #f0938c;
      --sobre-acento: #10171d;
    }
  }

  * { box-sizing: border-box; }

  /* 17px e entrelinha larga: o acervo é operado por gente de todas as idades,
     em pé, no corredor. Atkinson Hyperlegible foi desenhada para baixa visão e
     distingue 0 de O e 1 de l — num sistema em que tudo é número de tombo,
     isso deixa de ser detalhe. */
  body {
    margin: 0;
    padding: 0 1rem 3rem;
    background: var(--fundo);
    color: var(--tinta);
    font: 17px/1.6 "Atkinson Hyperlegible", system-ui, -apple-system,
          "Segoe UI", Roboto, sans-serif;
  }

  h1, h2, legend {
    font-family: Bitter, Georgia, "Times New Roman", serif;
    text-wrap: balance;
  }

  /* Número de tombo, prazo, contagem: alinhados em coluna. */
  .meta, .selo, kbd { font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }

  main, .topo { max-width: 46rem; margin: 0 auto; }

  /* --- topo --- */
  .topo { padding-top: 1.25rem; }
  .topo h1 { margin: 0 0 .75rem; font-size: 1.35rem; }

  /* Sete abas não cabem em 360px. Rolagem lateral é o padrão que as pessoas
     já conhecem, e é melhor que quebrar em duas linhas ou espremer o texto
     até virar ilegível. */
  .abas {
    display: flex;
    gap: .25rem;
    border-bottom: 1px solid var(--borda);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .abas::-webkit-scrollbar { display: none; }
  .aba { flex: none; white-space: nowrap; }
  .aba {
    appearance: none;
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    padding: .6rem .9rem;
    min-height: 44px;
    font: inherit;
    color: var(--tinta-fraca);
    cursor: pointer;
  }
  .aba:hover { color: var(--tinta); }
  .aba.ativa { color: var(--acento); border-bottom-color: var(--acento); font-weight: 600; }

  /* Azul é o que todos veem; marrom é o que só o voluntário vê. As duas cores
     vêm da logomarca, então a distinção pertence à casa e não é decoração.
     Serve a duas coisas ao mesmo tempo: o voluntário sabe onde está pisando, e
     lembra do que NÃO é público — o que importa numa tela que mostra com quem
     está cada livro. */
  .aba[data-restrito] { color: var(--marrom); }
  .aba[data-restrito]:hover { color: var(--marrom); opacity: .8; }
  .aba[data-restrito].ativa {
    color: var(--marrom);
    border-bottom-color: var(--marrom);
  }

  .legenda-abas {
    margin: .6rem 0 0;
    color: var(--tinta-fraca);
    font-size: .8rem;
  }
  .legenda-abas strong { color: var(--marrom); }

  .visao { padding-top: 1.25rem; }
  .oculta { display: none; }

  /* --- busca --- */
  .linha-busca { display: flex; gap: .5rem; }
  .linha-busca input { flex: 1; }

  .dica { color: var(--tinta-fraca); font-size: .85rem; margin: .4rem 0 0; }

  .resultados { list-style: none; padding: 0; margin: 1rem 0 0; }
  .resultado {
    padding: .9rem 0;
    border-bottom: 1px solid var(--borda);
  }
  .resultado h2 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  .resultado .autoria { margin: .15rem 0 0; }
  .resultado .meta { margin: .15rem 0 0; color: var(--tinta-fraca); font-size: .85rem; }

  .selo {
    display: inline-block;
    margin-top: .45rem;
    padding: .15rem .5rem;
    border-radius: 999px;
    font-size: .8rem;
    font-weight: 600;
    background: var(--fundo-suave);
  }
  .selo.disponivel   { color: var(--disponivel); }
  .selo.emprestado   { color: var(--emprestado); }
  .selo.sem_exemplar { color: var(--ausente); }

  .estado { margin-top: .9rem; color: var(--tinta-fraca); }
  .estado.erro { color: var(--erro); }
  .estado.ok { color: var(--disponivel); }


  /* Os tombos gerados agora, para copiar na etiqueta.
     Marrom do hábito: é a única coisa da tela que sai para o papel, e não é
     nem estado do sistema (azul) nem disponibilidade (verde). */
  .etiquetas {
    margin: 0 0 1.2rem;
    padding: .8rem 1rem 1rem;
    background: var(--marrom-suave);
    border-left: 4px solid var(--marrom);
    border-radius: 6px;
  }
  .etiquetas-titulo {
    margin: 0 0 .5rem;
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--marrom);
  }
  .etiquetas ul { list-style: none; margin: 0; padding: 0; }
  .etiquetas li {
    display: flex;
    align-items: baseline;
    gap: .7rem;
    padding: .25rem 0;
  }
  .etiqueta-tombo {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--tinta);
    /* Dígitos de mesma largura: a coluna de números fica alinhada e o
       voluntário confere a pilha de cima a baixo sem reler. */
    font-variant-numeric: tabular-nums;
    min-width: 3.2ch;
    text-align: right;
  }
  .etiqueta-obra { color: var(--tinta-fraca); font-size: .9rem; }

  .etiquetas .discreto { margin-top: .6rem; }

  /* --- formulário --- */
  fieldset {
    border: 1px solid var(--borda);
    border-radius: 8px;
    padding: .9rem 1rem 1.1rem;
    margin: 0 0 1rem;
  }
  legend { padding: 0 .35rem; font-weight: 600; font-size: .9rem; }

  label { display: block; margin-top: .8rem; font-size: .85rem; color: var(--tinta-fraca); }
  label.caixa { display: flex; align-items: center; gap: .5rem; color: var(--tinta); font-size: 1rem; }
  label.cresce { flex: 1; }

  input, select, textarea {
    display: block;
    width: 100%;
    margin-top: .2rem;
    padding: .55rem .6rem;
    min-height: 44px;
    border: 1px solid var(--borda);
    border-radius: 6px;
    font: inherit;          /* 16px: abaixo disso o iOS dá zoom ao focar */
    color: var(--tinta);
    background: var(--fundo);
  }
  input[type="checkbox"] { width: auto; min-height: 0; margin: 0; }
  textarea { min-height: 0; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible,
  a:focus-visible, .aba:focus-visible {
    outline: 3px solid var(--acento);
    outline-offset: 2px;
  }

  .par { display: flex; gap: .75rem; }
  .par > label { flex: 1; }
  .linha-isbn { display: flex; gap: .5rem; align-items: flex-end; }

  .obrigatorio { color: var(--erro); }

  /* Candidatos da busca por título. Precisam mostrar editora e ano: é o que
     distingue uma edição da outra, e escolher a errada erra a ficha. */
  .candidatos { list-style: none; padding: 0; margin: .6rem 0 0; }
  .candidatos:empty { margin: 0; }
  .candidatos li { margin-bottom: .4rem; }
  .candidato {
    display: block;
    width: 100%;
    text-align: left;
    padding: .55rem .7rem;
    background: var(--fundo-suave);
    color: var(--tinta);
    border: 1px solid var(--borda);
    font-weight: 400;
    line-height: 1.35;
  }
  .candidato strong { display: block; font-weight: 600; }
  .candidato small { color: var(--tinta-fraca); }

  button {
    padding: .6rem 1.1rem;
    min-height: 44px;
    border: 1px solid var(--acento);
    border-radius: 6px;
    background: var(--acento);
    color: var(--sobre-acento);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button[type="button"] { background: var(--fundo); color: var(--acento); }
  button:disabled { opacity: .55; cursor: progress; }

  #btn-salvar { width: 100%; }

  /* Duplicata é escolha, não erro: amarelo de atenção, não vermelho de falha,
     e a opção mais provável vem primeiro e destacada. */
  .aviso {
    border: 1px solid var(--aviso-borda);
    border-left: 4px solid var(--aviso-borda);
    border-radius: 6px;
    background: var(--aviso-fundo);
    color: var(--tinta);
    padding: .8rem 1rem;
    margin-bottom: 1rem;
  }
  .aviso p { margin: 0 0 .5rem; }
  .escolhas { display: flex; flex-direction: column; gap: .5rem; }
  .escolhas button { width: 100%; }
  /* Abas de segundo nível, dentro do Cadastrar. Menores que as do topo, para
     a hierarquia ficar óbvia sem precisar de explicação. */
  .abas-internas { display: flex; gap: .25rem; margin-bottom: 1rem; }
  .aba-interna {
    background: var(--fundo-suave);
    color: var(--tinta-fraca);
    border: 1px solid var(--borda);
    font-weight: 400;
    padding: .4rem .9rem;
  }
  .aba-interna.ativa {
    background: var(--acento);
    color: var(--sobre-acento);
    border-color: var(--acento);
    font-weight: 600;
  }

  /* Ficha do exemplar no balcão. Grande e legível: é lida em pé, de relance. */
  .ficha {
    border: 1px solid var(--borda);
    border-radius: 8px;
    padding: 1rem;
    margin-top: 1rem;
  }
  .ficha h2 { margin: 0 0 .1rem; font-size: 1.15rem; }
  .ficha .selo { font-size: .95rem; }

  .escolhas-linha { display: flex; gap: .5rem; flex-wrap: wrap; }

  /* Linha de empréstimo na lista de atrasos. */
  .atrasado { border-left: 4px solid var(--emprestado); padding-left: .7rem; }
  .dias-atraso { color: var(--emprestado); font-weight: 600; }

  /* Barra de identidade: discreta, mas sempre visivel — quem esta de plantao
     precisa saber com que conta esta gravando. */
  .identidade {
    display: flex;
    align-items: center;
    gap: .5rem;
    flex: none;
    font-size: .85rem;
    color: var(--tinta-fraca);
  }
  .identidade button { padding: .35rem .8rem; min-height: 38px; font-size: .85rem; }

  /* O nome corta com reticências antes de empurrar o botão para fora. */
  #quem-sou {
    max-width: 11rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #meu-nome { color: var(--tinta); }

  .cartao-entrada {
    max-width: 24rem;
    border: 1px solid var(--borda);
    border-radius: 8px;
    padding: 1.2rem;
  }
  .cartao-entrada h2 { margin: 0 0 .3rem; font-size: 1.1rem; }
  .cartao-entrada button { width: 100%; margin-top: .9rem; }

  button.discreto {
    background: var(--fundo);
    color: var(--tinta-fraca);
    border-color: var(--borda);
    font-weight: 400;
  }

  /* --- marca da casa ---
     O símbolo tem fundo transparente, então funciona nos dois temas sem
     tratamento. O nome vem do Config e fica ao lado, e não dentro da imagem:
     assim ele é texto de verdade — selecionável, lido por leitor de tela e
     legível em qualquer tamanho de fonte. */
  .cabeca {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: .8rem;
  }
  .marca { display: flex; align-items: center; gap: .75rem; min-width: 0; }
  .marca h1 {
    margin: 0;
    font-size: 1.3rem;
    line-height: 1.2;
    color: var(--acento);
  }
  .logo { width: 48px; height: 48px; object-fit: contain; flex: none; }

  @media (max-width: 30rem) {
    .marca h1 { font-size: 1.05rem; }
    .logo { width: 40px; height: 40px; }
    /* O perfil sai; o nome fica. Saber COM QUEM se grava é o que importa. */
    #meu-perfil { display: none; }
    #quem-sou { max-width: 6.5rem; }
  }

  /* --- manual ---
     Coluna mais estreita que o resto do sistema: as outras telas são listas e
     formulários, esta é texto corrido, e linha longa demais cansa a leitura. */
  /* Coluna mais estreita que o resto do sistema: as outras telas são listas e
     formulários; esta é texto corrido, e linha longa demais cansa a leitura.
     Centralizada, para não destoar do cabeçalho — o resto do sistema tem 46rem
     centrados, e um bloco de 36rem encostado à esquerda pareceria defeito. */
  #visao-manual { max-width: 36rem; margin-inline: auto; }
  .manual-abertura { font-size: 1rem; margin-bottom: 1.5rem; }

  /* O índice é um MENU, e precisa parecer um. Antes cada linha repetia a
     etiqueta de contexto ("NO BALCÃO" quatro vezes) num arranjo idêntico ao
     cabeçalho do texto — clicar parecia expandir e duplicar, não navegar.
     Agora a etiqueta virou título de grupo, e a linha virou uma escolha. */
  .manual-indice { display: block; margin-top: .5rem; }


  /* Os dois grupos da busca: o que está na estante e o que só existe no
     catálogo. A separação é a resposta à pergunta do balcão — "vocês têm?" —
     e por isso precisa se ler antes de qualquer título.

     Classe própria e não `.grupo`, que já é dos assuntos do manual: as duas
     coisas são <details> em <li> e as regras se atropelariam. */
  .divisor {
    list-style: none;
    margin: 1.2rem 0 .2rem;
  }
  .divisor:first-child { margin-top: .4rem; }

  .divisor-na-casa h2 {
    margin: 0;
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--disponivel);
    padding-bottom: .3rem;
    border-bottom: 2px solid var(--disponivel);
  }

  .divisor-ausente > details > summary {
    cursor: pointer;
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ausente);
    padding: .45rem 0;
    border-bottom: 2px solid var(--borda);
    /* Alvo de toque: vai ser usado no celular, em pé. */
    min-height: 44px;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .divisor-ausente > details > summary::-webkit-details-marker { display: none; }
  .divisor-ausente > details > summary::after {
    content: 'mostrar';
    margin-left: auto;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 600;
    color: var(--acento);
  }
  .divisor-ausente > details[open] > summary::after { content: 'esconder'; }
  .divisor-ausente > details > summary:hover { color: var(--acento); }
  .divisor-ausente > details > summary:focus-visible {
    outline: 3px solid var(--acento);
    outline-offset: 2px;
  }

  .divisor-ausente .dica { margin: .6rem 0 0; }
  .divisor-ausente .resultados { margin-top: .4rem; }

  /* Grupos fechados: o índice são cinco linhas e continua cabendo numa tela
     por mais que o manual cresça. Antes a lista aberta crescia junto com o
     número de assuntos, e achar um exigia rolar. */
  .grupo { border-bottom: 1px solid var(--borda); }

  .grupo summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .8rem;
    min-height: 56px;
    padding: .6rem .2rem .6rem .8rem;
    font-weight: 700;
    color: var(--tinta);
    cursor: pointer;
    list-style: none;                 /* tira o triângulo do Firefox */
  }
  .grupo summary::-webkit-details-marker { display: none; }
  .grupo summary:hover { color: var(--acento); }
  .grupo summary:focus-visible { outline: 3px solid var(--acento); outline-offset: -3px; }

  .grupo summary small {
    color: var(--tinta-fraca);
    font-weight: 400;
    font-size: .8rem;
    white-space: nowrap;
  }
  /* A seta gira ao abrir: é o sinal de que há algo dentro. */
  .grupo summary::after {
    content: "›";
    color: var(--tinta-fraca);
    font-size: 1.4rem;
    line-height: 1;
    transition: transform .15s;
  }
  .grupo[open] summary::after { transform: rotate(90deg); }
  .grupo[open] summary { color: var(--acento); }

  .grupo > a { padding-left: 1.8rem; background: var(--fundo-suave); }
  .grupo > a:last-child { border-bottom: none; }

  .manual-indice a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .8rem;
    min-height: 50px;
    padding: .5rem .2rem .5rem .8rem;
    border-bottom: 1px solid var(--borda);
    border-left: 3px solid transparent;
    color: var(--tinta);
    text-decoration: none;
  }
  /* A seta diz que a linha LEVA a algum lugar. Decorativa para leitor de tela:
     o link já anuncia o destino. */
  .manual-indice a::after {
    content: "›";
    color: var(--tinta-fraca);
    font-size: 1.4rem;
    line-height: 1;
  }
  .manual-indice a:hover,
  .manual-indice a:focus-visible {
    background: var(--acento-suave);
    border-left-color: var(--acento);
    color: var(--acento);
  }
  .manual-indice a:hover::after { color: var(--acento); }

  /* Voltar é o controle mais importante da tela de leitura: quem se perdeu no
     meio de um assunto precisa achá-lo sem procurar. */
  #voltar-manual {
    margin-bottom: 1.4rem;
    padding-left: .7rem;
  }

  /* O assunto é uma FOLHA sobre a página: fundo próprio, borda, cantos
     arredondados. O índice fica no papel branco; o texto, numa folha por cima.
     A diferença de superfície diz "você saiu da lista e entrou num documento"
     antes de qualquer palavra ser lida. */
  .verbete {
    padding: 1.1rem 1.2rem 1.6rem;
    background: var(--fundo-suave);
    border: 1px solid var(--borda);
    border-radius: 10px;
  }
  .verbete > h2 {
    margin: .2rem 0 1.2rem;
    padding-bottom: .8rem;
    border-bottom: 2px solid var(--acento);
    font-size: 1.4rem;
  }

  /* Numa tela estreita a folha ocupa quase tudo; margem lateral grossa só
     rouba largura de leitura. */
  @media (max-width: 30rem) {
    .verbete { padding: .9rem .85rem 1.3rem; border-radius: 8px; }
  }
  .verbete h2:focus { outline: none; }   /* o foco existe para leitor de tela */

  /* Diz ONDE se faz a coisa. É informação: metade da dúvida do voluntário é
     "isso é no sistema ou na planilha?". */
  .onde-fica {
    display: inline-block;
    margin: 0;
    padding: .18rem .5rem;
    border: 1px solid var(--borda);
    border-radius: 3px;
    background: var(--marrom-suave);
    color: var(--marrom);
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
  }

  ol.passos { margin: 1rem 0 0; padding-left: 0; list-style: none; counter-reset: passo; }
  ol.passos > li {
    counter-increment: passo;
    position: relative;
    padding-left: 2.4rem;
    margin-bottom: .8rem;
  }
  ol.passos > li::before {
    content: counter(passo);
    position: absolute;
    left: 0;
    top: .05rem;
    width: 1.7rem;
    height: 1.7rem;
    border-radius: 50%;
    background: var(--acento);
    color: var(--sobre-acento);
    font-size: .9rem;
    font-weight: 700;
    line-height: 1.7rem;
    text-align: center;
  }

  /* Fundo do PAPEL, não da folha: sobre o painel cinza, a tecla fica em
